<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Ryan's Study Shelf</title>
<style>
:root{
  --paper:#f7f5ef; --ink:#1b1b1b; --soft:#6b665c; --line:#d9d4c7; --card:#fbfaf6; --accent:#1b1b1b; --ok:#2f6b3a; --warn:#8a5a00;
  --fs:19px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased}
#app{max-width:44rem;margin:0 auto;padding:0 18px 80px}
header.top{display:flex;align-items:center;gap:10px;padding:18px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
header.top .crumb{flex:1;font:600 13px/1.3 system-ui,-apple-system,"Helvetica Neue",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font:700 14px/1 system-ui,-apple-system,"Helvetica Neue",sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:12px 16px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#000}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[disabled]:hover{background:var(--paper);color:var(--ink)}
.btn.solid[disabled]:hover{background:var(--ink);color:var(--paper)}
.btn.small{padding:8px 11px;font-size:12px}
.btn.ghost{border-color:var(--line);color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h1{font-size:2rem;line-height:1.2;margin:34px 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;margin:2em 0 .4em;line-height:1.3}
h3{font-size:1.1rem;margin:1.6em 0 .3em}
.sub{color:var(--soft);margin:0 0 24px;font-style:italic}
.small-caps{font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin:0 0 12px;cursor:pointer;color:inherit;font:inherit}
.card:hover{border-color:var(--ink)}
.card .name{font-size:1.3rem;font-weight:700;line-height:1.3}
.card .meta{color:var(--soft);font-size:.85rem;margin-top:2px}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pct{font:700 15px system-ui,sans-serif;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.tag{display:inline-block;font:600 11px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--soft);color:var(--soft);border-radius:2px;margin-right:6px}
.tag.done{border-color:var(--ok);color:var(--ok)}
.tag.wait{border-color:var(--warn);color:var(--warn)}
.tag.now{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* reading */
.read h1{font-size:1.7rem}
.read h2{font-size:1.4rem;border-top:1px solid var(--line);padding-top:1.2em}
.read p{margin:.8em 0}
.read table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.82em;line-height:1.45}
.read th,.read td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.read th{font-family:system-ui,sans-serif;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);border-bottom:2px solid var(--ink)}
.read blockquote{margin:1.2em 0;padding:.2em 1.2em;border-left:3px solid var(--ink);background:var(--card)}
.read ul,.read ol{padding-left:1.4em}
.read li{margin:.25em 0}
.read hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.read code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.blank{display:inline-block;min-width:4.5em;border-bottom:1.5px solid var(--ink);height:1em;vertical-align:baseline;margin:0 2px}
.sticky-foot{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:22px 0 14px;margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
/* widgets */
.opt{display:block;margin:6px 0;cursor:pointer;line-height:1.45}
.opt input,.tick input{width:20px;height:20px;accent-color:#1b1b1b;vertical-align:-4px;margin-right:6px}
.opts-inline .opt{display:inline-block;margin-right:18px}
.tick{display:flex;justify-content:center}
.tick input{width:26px;height:26px;margin:0}
.read td .opt{display:inline-block;margin:0 10px 0 0}
input.cell,select.cell{font:inherit;font-size:.95rem;width:100%;min-width:5em;padding:6px 8px;border:1.5px solid var(--ink);border-radius:3px;background:#fff}
.vf{display:inline-block;white-space:nowrap;margin:0 6px}
.vf .opt{display:inline-block;margin:0 8px 0 0}
.read input.cell.inl,input.cell.inl{display:inline-block;width:9em;min-width:0;padding:3px 7px;margin:0 3px;vertical-align:baseline;border-width:0 0 2px 0;border-radius:0;background:#fffefa;max-width:100%}
.vfx{display:block;width:100%!important;margin:6px 0 10px}
/* test */
.q{border-top:1px solid var(--line);padding:18px 0 6px}
.q .qh{display:flex;gap:10px;align-items:baseline}
.q .num{font:700 15px system-ui,sans-serif;min-width:2.1em}
.q .qb{flex:1}
.q .qb>p:first-child{margin-top:0}
.q .mk{font:600 12px system-ui,sans-serif;color:var(--soft);white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}
textarea{width:100%;font:inherit;font-size:.95rem;line-height:1.5;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:3px;padding:10px 12px;resize:vertical;min-height:3.2em;margin:8px 0}
textarea:focus{outline:3px solid #1b1b1b22}
textarea.work{min-height:6em;background:#fffefa}
.lbl{font:600 11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.group{font-weight:600;margin-top:1.6em}
.toolbar{position:sticky;top:61px;background:var(--paper);z-index:4;padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.toolbar button{font:600 15px system-ui,sans-serif;min-width:34px;padding:5px 8px;background:#fff;border:1px solid var(--soft);border-radius:3px;cursor:pointer}
.toolbar button:hover{background:var(--ink);color:#fff}
.toolbar .lbl{margin:0 6px 0 0}
.note{border:1px solid var(--line);background:var(--card);padding:12px 16px;border-radius:4px;margin:16px 0;font-size:.9rem}
.note.warn{border-color:var(--warn)}
.audio{border:2px solid var(--ink);padding:14px 16px;border-radius:4px;margin:18px 0}
.score{font-size:3rem;font-weight:700;line-height:1;margin:6px 0}
.ans{white-space:pre-wrap;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:3px;font-size:.92rem;margin:6px 0}
.ans.empty{color:var(--soft);font-style:italic}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:10px 0;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:4px;accent-color:#1b1b1b;flex:none}
input[type=number],input[type=password],input[type=text]{font:inherit;font-size:1rem;padding:8px 10px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;width:8em}
input.note-in{width:100%;margin:4px 0}
.modal-bg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:4px;max-width:30rem;width:100%;padding:22px}
.modal h3{margin-top:0}
.foot-note{color:var(--soft);font-size:.8rem;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
@media print{
  header.top,.sticky-foot,.toolbar,.btn,.noprint{display:none!important}
  body{background:#fff;font-size:12pt}
  textarea{border:1px solid #999}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"subjects": [{"id": "bio", "name": "Biologia i Geologia", "tag": "Biology & Geology", "modules": [{"id": "bio1", "n": 1, "title": "Les parts del microscopi", "sub": "Parts of the microscope", "study": null, "learn": "<p><strong>The big idea.</strong> A microscope makes very small things (like cells) look bigger so we can see them. It has three jobs: <strong>light</strong> shines through the sample, <strong>lenses</strong> make it bigger, and <strong>focus wheels</strong> make it sharp. Learn the parts by their job, not just their name.</p>\n<table>\n<thead>\n<tr>\n<th>Part (Català)</th>\n<th>English</th>\n<th>Function (what it does)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ocular</td>\n<td>eyepiece</td>\n<td>The lens you look through. It magnifies (usually ×10).</td>\n</tr>\n<tr>\n<td>tub</td>\n<td>tube</td>\n<td>Joins the eyepiece to the objective lenses.</td>\n</tr>\n<tr>\n<td>revòlver</td>\n<td>revolving nosepiece</td>\n<td>Turns to change from one objective to another.</td>\n</tr>\n<tr>\n<td>objectius</td>\n<td>objective lenses</td>\n<td>Lenses close to the sample (×4, ×10, ×40). They magnify the most.</td>\n</tr>\n<tr>\n<td>platina</td>\n<td>stage</td>\n<td>Flat plate where the slide (la preparació) is placed.</td>\n</tr>\n<tr>\n<td>pinces</td>\n<td>clips</td>\n<td>Hold the slide still on the stage.</td>\n</tr>\n<tr>\n<td>font de llum</td>\n<td>light source</td>\n<td>Gives the light that passes through the sample.</td>\n</tr>\n<tr>\n<td>diafragma</td>\n<td>diaphragm</td>\n<td>Controls how much light reaches the sample.</td>\n</tr>\n<tr>\n<td>cargol macromètric</td>\n<td>coarse focus wheel</td>\n<td>Moves the stage a lot: first, quick, blurry focus.</td>\n</tr>\n<tr>\n<td>cargol micromètric</td>\n<td>fine focus wheel</td>\n<td>Moves it a little: makes the image sharp.</td>\n</tr>\n<tr>\n<td>braç</td>\n<td>arm</td>\n<td>Holds the tube; this is where you carry the microscope.</td>\n</tr>\n<tr>\n<td>peu (base)</td>\n<td>base</td>\n<td>Supports the whole microscope.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Total magnification</strong> = eyepiece × objective. Example: ocular ×10 and objectiu ×40 give 10 × 40 = <strong>400 augments</strong> (400 times bigger).</p>\n<p><strong>How to use it (in order).</strong> 1) Put the slide on the stage and fix it with the clips. 2) Start with the smallest objective (×4). 3) Focus with the coarse wheel, then the fine wheel. 4) Only then change to a bigger objective and focus with the <strong>fine</strong> wheel only.</p>\n<p><strong>Grouping that helps memory.</strong> Optical parts (they make the image): ocular, objectius. Mechanical parts (they hold and move): tub, revòlver, platina, pinces, braç, peu, cargols. Lighting: font de llum, diafragma.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Which parts hold or support the microscope?</li>\n<li>Eyepiece ×10 and objective ×10: what is the total magnification?</li>\n<li>Which objective do you use first, and why?</li>\n</ol>", "test": {"marks": 8, "minutes": 10, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb frases curtes. (Instructions: answer with short sentences.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Escriu el nom de la part del microscopi. (Write the name of the part.)</p>\n<p>a) Hi mires amb l'ull. (You look through it.) <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) Hi poses la preparació. (You put the slide on it.) <span class=\"blank\" data-n=\"12\"></span></p>\n<p>c) Serveix per enfocar amb més precisió. (It gives the sharp focus.) <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 1.0, "html": "<p>L'ocular és ×10 i l'objectiu és ×40. Quants augments té el microscopi en total? Escriu el càlcul. (Write the calculation.) <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Completa amb les paraules: <em>diafragma, revòlver, pinces, tub</em>.</p>\n<p>a) El <span class=\"blank\" data-n=\"12\"></span> controla la quantitat de llum.</p>\n<p>b) El <span class=\"blank\" data-n=\"12\"></span> gira per canviar d'objectiu.</p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Per a què serveix el microscopi? Escriu una frase completa. (What is a microscope for? Write a full sentence.)</p>", "maths": false}], "footer": "<p><em>Revisa: has contestat totes les preguntes? Has escrit les unitats?</em></p>", "rule": "", "title": "Test 1 – Microscopi"}}, {"id": "bio2", "n": 2, "title": "La cèl·lula", "sub": "The cell", "study": null, "learn": "<p><strong>The big idea.</strong> The cell is the smallest living unit. Every living thing is made of cells, and one cell can already do the three vital functions (nutrition, relation, reproduction). Some living things have only one cell (unicel·lulars: bacteria, yeast); others have millions (pluricel·lulars: a dog, an oak).</p>\n<p><strong>Definition to learn (say it in a full sentence):</strong> <em>La cèl·lula és la unitat bàsica dels éssers vius: tots els éssers vius estan formats per cèl·lules.</em></p>\n<p><strong>Every cell has three basic parts.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Part (Català)</th>\n<th>English</th>\n<th>Function</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>membrana plasmàtica</td>\n<td>cell membrane</td>\n<td>Thin skin that decides what enters and leaves the cell.</td>\n</tr>\n<tr>\n<td>citoplasma</td>\n<td>cytoplasm</td>\n<td>Jelly inside the cell; the organelles float in it.</td>\n</tr>\n<tr>\n<td>nucli</td>\n<td>nucleus</td>\n<td>Control centre; holds the genetic material (the instructions of the cell).</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Organelles (orgànuls)</strong> are tiny \"organs\" inside the cell, each with a job. Learn these cards word for word, because the school exam asks you to explain them from memory:</p>\n<table>\n<thead>\n<tr>\n<th>Orgànul</th>\n<th>English</th>\n<th>What it is and what it does</th>\n<th>Found in</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>mitocondri</td>\n<td>mitochondrion</td>\n<td>Makes energy from food: it does the <strong>respiració cel·lular</strong>.</td>\n<td><strong>animal AND plant cells</strong></td>\n</tr>\n<tr>\n<td>cloroplast</td>\n<td>chloroplast</td>\n<td>Contains chlorophyll (green). It does the <strong>fotosíntesi</strong>.</td>\n<td>plant cells only</td>\n</tr>\n<tr>\n<td>vacúol</td>\n<td>vacuole</td>\n<td>Bag that stores water and other substances. Very large in plant cells.</td>\n<td>both (large in plant)</td>\n</tr>\n<tr>\n<td>paret cel·lular</td>\n<td>cell wall</td>\n<td>Hard outer layer that protects the cell and gives it its shape.</td>\n<td>plant cells only</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Animal cell versus plant cell.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>Animal cell</th>\n<th>Plant cell</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>membrana, citoplasma, nucli</td>\n<td>yes</td>\n<td>yes</td>\n</tr>\n<tr>\n<td>mitocondris</td>\n<td>yes</td>\n<td>yes</td>\n</tr>\n<tr>\n<td>cloroplasts</td>\n<td>no</td>\n<td>yes</td>\n</tr>\n<tr>\n<td>paret cel·lular</td>\n<td>no</td>\n<td>yes</td>\n</tr>\n<tr>\n<td>vacúol</td>\n<td>small, several</td>\n<td>one very large</td>\n</tr>\n<tr>\n<td>shape</td>\n<td>round or irregular</td>\n<td>regular, often rectangular</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Memory trick.</strong> Plants need to make food and stay upright, so they have extra: cloroplasts (food factory), paret (strong wall), big vacúol (water store). Both cell types need energy, so both have mitocondris.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Name the three parts that every cell has.</li>\n<li>Which organelle makes energy, and does a plant cell have it?</li>\n<li>Give two differences between an animal and a plant cell.</li>\n</ol>", "test": {"marks": 12, "minutes": 15, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb frases curtes i completes. (Answer with short, complete sentences.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 2.0, "html": "<p>Defineix què és una cèl·lula. (Define a cell in one full sentence.)</p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Marca amb una ✓ on hi és. (Tick where it is found.)</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>Cèl·lula animal</th>\n<th>Cèl·lula vegetal</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>cloroplast</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>mitocondri</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>paret cel·lular</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 3.0, "html": "<p>Uneix cada orgànul amb la seva funció. (Match each organelle with its function.)</p>\n<table>\n<thead>\n<tr>\n<th>Orgànul</th>\n<th>Funció</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A. mitocondri</td>\n<td>1. Fa la fotosíntesi</td>\n</tr>\n<tr>\n<td>B. cloroplast</td>\n<td>2. Obté energia (respiració cel·lular)</td>\n</tr>\n<tr>\n<td>C. nucli</td>\n<td>3. Controla la cèl·lula i guarda el material genètic</td>\n</tr>\n<tr>\n<td></td>\n<td>4. Protegeix i dona forma a la cèl·lula vegetal</td>\n</tr>\n</tbody>\n</table>\n<p>A → <span class=\"blank\" data-n=\"4\"></span>   B → <span class=\"blank\" data-n=\"4\"></span>   C → <span class=\"blank\" data-n=\"4\"></span></p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Una cèl·lula té forma rectangular, una paret gruixuda i cloroplasts. És animal o vegetal? Explica-ho. (Animal or plant? Explain why.)</p>", "maths": false}, {"t": "q", "id": "q5", "n": "5", "marks": 2.0, "html": "<p>Escriu dues diferències entre una cèl·lula animal i una cèl·lula vegetal. (Write two differences.)</p>\n<ol>\n<li>\n<hr />\n</li>\n<li>\n<hr />\n</li>\n</ol>", "maths": false}], "footer": "<p><em>Revisa: has contestat totes les preguntes? Has escrit frases completes a Q1, Q4 i Q5?</em></p>", "rule": "", "title": "Test 2 – La cèl·lula"}}, {"id": "bio3", "n": 3, "title": "Micromètres i mil·límetres", "sub": "µm ↔ mm", "study": null, "learn": "<p><strong>The big idea.</strong> Cells are so small that we measure them in micrometres (µm, in Catalan <em>micromètre</em>). One millimetre contains <strong>1000 micrometres</strong>: 1 mm = 1000 µm, so 1 µm = 0,001 mm. A µm is the smaller unit, so the same length needs a <strong>bigger number</strong> in µm than in mm.</p>\n<table>\n<thead>\n<tr>\n<th>You want to go</th>\n<th>Do this</th>\n<th>Move the comma</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>mm → µm</td>\n<td>multiply by 1000 (×1000)</td>\n<td>3 places to the <strong>right</strong></td>\n</tr>\n<tr>\n<td>µm → mm</td>\n<td>divide by 1000 (÷1000)</td>\n<td>3 places to the <strong>left</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Worked examples.</strong></p>\n<ul>\n<li>3 mm → µm: 3 × 1000 = <strong>3000 µm</strong></li>\n<li>0,5 mm → µm: 0,5 × 1000 = <strong>500 µm</strong></li>\n<li>250 µm → mm: 250 ÷ 1000 = <strong>0,25 mm</strong></li>\n<li>45 µm → mm: 45 ÷ 1000 = <strong>0,045 mm</strong></li>\n<li>8 µm → mm: 8 ÷ 1000 = <strong>0,008 mm</strong></li>\n</ul>\n<p><strong>Check your answer with common sense.</strong> If you go from mm to µm the number must get <strong>bigger</strong>; from µm to mm it must get <strong>smaller</strong>.</p>\n<p><strong>Real sizes to picture.</strong> A bacterium ≈ 2 µm; a red blood cell ≈ 7 µm; a human cheek cell ≈ 60 µm; an onion cell ≈ 0,2 mm (200 µm).</p>\n<p><strong>Catalan note.</strong> In Catalan (and in this school) the decimal separator is a <strong>comma</strong>: 0,25 mm, not 0.25 mm. Always write the unit after the number.</p>\n<p><strong>Comparing sizes.</strong> To compare two lengths, first write both in the <strong>same unit</strong>, then compare.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>4 mm = ? µm</li>\n<li>600 µm = ? mm</li>\n<li>Which is longer, 0,1 mm or 80 µm? Show why.</li>\n</ol>", "test": {"marks": 8, "minutes": 10, "elements": [{"t": "text", "html": "<p><em>Instruccions: Escriu el càlcul i la unitat. Fes servir la coma decimal. (Write the calculation and the unit. Use the decimal comma.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Passa de mm a µm. (Change mm to µm.)</p>\n<p>a) 2 mm = <span class=\"blank\" data-n=\"12\"></span> µm</p>\n<p>b) 0,7 mm = <span class=\"blank\" data-n=\"12\"></span> µm</p>\n<p>c) 12 mm = <span class=\"blank\" data-n=\"12\"></span> µm</p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Passa de µm a mm. (Change µm to mm.)</p>\n<p>a) 5000 µm = <span class=\"blank\" data-n=\"12\"></span> mm</p>\n<p>b) 80 µm = <span class=\"blank\" data-n=\"12\"></span> mm</p>\n<p>c) 350 µm = <span class=\"blank\" data-n=\"12\"></span> mm</p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Una cèl·lula vegetal mesura 0,25 mm. Un bacteri mesura 5 µm. Qui és més gran? Passa les dues mides a la mateixa unitat i explica la resposta. (Which is bigger? Change both to the same unit and explain.)</p>", "maths": false}], "footer": "<p><em>Revisa: has escrit la unitat a totes les respostes? Has fet servir la coma?</em></p>", "rule": "", "title": "Test 3 – µm i mm"}}, {"id": "bio4", "n": 4, "title": "Les funcions vitals", "sub": "The vital functions", "study": null, "learn": "<p><strong>The big idea.</strong> All living things (animals, plants, fungi, bacteria) do the same three jobs. If something does all three, it is alive. These are the <strong>funcions vitals</strong>: <strong>nutrició</strong>, <strong>relació</strong> and <strong>reproducció</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Funció vital</th>\n<th>English</th>\n<th>What it means</th>\n<th>Animal example</th>\n<th>Plant example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>nutrició</td>\n<td>nutrition</td>\n<td>Getting matter and energy to live and grow: taking in nutrients, breathing, transporting them, and getting rid of waste.</td>\n<td>A cow eats grass and breathes.</td>\n<td>A tree takes in water, salts and CO₂ and makes its food.</td>\n</tr>\n<tr>\n<td>relació</td>\n<td>relation</td>\n<td><strong>Receiving stimuli</strong> from the environment and <strong>responding</strong> to them.</td>\n<td>A cat runs away from a loud noise.</td>\n<td>A sunflower turns towards the light.</td>\n</tr>\n<tr>\n<td>reproducció</td>\n<td>reproduction</td>\n<td>Making new living things like itself, so the species continues.</td>\n<td>A hen lays eggs.</td>\n<td>A flower makes seeds.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The school's wording matters.</strong> The school calls the second function <strong>funció de relació</strong> and defines it as <em>rebre estímuls i respondre-hi</em> (to receive stimuli and respond to them). Use those words in the exam.</p>\n<p><strong>Nutrition has four parts</strong> (useful for questions about \"nutrició\"): getting nutrients (alimentsàció), breathing (respiració), transporting substances (circulació), and getting rid of waste (excreció).</p>\n<p><strong>Watch out.</strong> Plants DO carry out the relation function: they react to light, touch, gravity. Plants are just slower and have no nerves. If a statement says \"plants do <strong>not</strong> do relació\", it is <strong>false</strong>. Read statements with \"no\" twice before answering.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Name the three vital functions.</li>\n<li>Which function is it when a plant grows towards a window?</li>\n<li>What are the four parts of nutrition?</li>\n</ol>", "test": {"marks": 6, "minutes": 8, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb el nom de la funció vital. (Answer with the name of the vital function.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Escriu les tres funcions vitals. (Write the three vital functions.)</p>\n<ol>\n<li><span class=\"blank\" data-n=\"12\"></span>   2. <span class=\"blank\" data-n=\"12\"></span>   3. <span class=\"blank\" data-n=\"12\"></span></li>\n</ol>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 2.0, "html": "<p>Quina funció vital és? (Which vital function is it?)</p>\n<p>a) Una gallina pon ous. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) Un gos senti un so i gira el cap. <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 1.0, "html": "<p>Vertader o fals? Si és fals, explica per què en una frase. (True or false? If false, explain in one sentence.)</p>\n<p>«Les plantes no fan la funció de relació.»   <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false, "tf": true, "tfx": true}], "footer": "<p><em>Revisa: has contestat totes les preguntes?</em></p>", "rule": "", "title": "Test 4 – Funcions vitals"}}, {"id": "bio5", "n": 5, "title": "L'homeòstasi", "sub": "Homeostasis", "study": null, "learn": "<p><strong>The big idea.</strong> Outside the body, things change all the time (hot, cold, dry, wet). Inside the body, cells need things to stay <strong>almost the same</strong> to work well. <strong>Homeòstasi</strong> is the body's way of keeping its inside conditions stable, even when the outside changes.</p>\n<p><strong>Definition to learn (use it word for word):</strong> <em>L'homeòstasi és la capacitat dels éssers vius de mantenir estables les condicions internes del seu cos, encara que l'ambient canviïi.</em></p>\n<p><strong>Common mistake.</strong> Homeostasis is <strong>not</strong> \"a change in the body\". It is the opposite: it is <strong>keeping things the same</strong>. If your definition says \"change\", look again.</p>\n<p><strong>Examples (learn two or three).</strong></p>\n<table>\n<thead>\n<tr>\n<th>Condition kept stable</th>\n<th>Situation</th>\n<th>What the body does</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>body temperature (≈ 37 °C)</td>\n<td>It is hot</td>\n<td>We <strong>sweat</strong> (suem): the sweat evaporates and cools the body.</td>\n</tr>\n<tr>\n<td>body temperature (≈ 37 °C)</td>\n<td>It is cold</td>\n<td>We <strong>shiver</strong> (tremolem) and the skin blood vessels narrow: this makes heat and keeps it in.</td>\n</tr>\n<tr>\n<td>water in the body</td>\n<td>We have lost water</td>\n<td>We feel thirsty (set) and drink; we produce less urine.</td>\n</tr>\n<tr>\n<td>sugar in the blood</td>\n<td>After a meal, sugar goes up</td>\n<td>The body releases insulin, which brings the sugar back down.</td>\n</tr>\n<tr>\n<td>water in a plant</td>\n<td>The day is very dry and hot</td>\n<td>The leaf pores (estomes) close to lose less water.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Which example to use in an exam.</strong> Use <strong>sweating</strong> or <strong>shivering</strong>: they clearly show \"keeping 37 °C\". Do not use \"fever\" as your example: the teacher did not accept it in the school exam, because fever is a change in temperature caused by illness, not a way of keeping it constant.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Finish the sentence: \"Homeostasis means keeping the internal conditions <span class=\"blank\" data-n=\"4\"></span>.\"</li>\n<li>Why do we shiver when it is cold?</li>\n<li>Give an example of homeostasis that is not about temperature.</li>\n</ol>", "test": {"marks": 6, "minutes": 8, "elements": [{"t": "text", "html": "<p><em>Instruccions: Escriu frases completes. (Write complete sentences.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 2.0, "html": "<p>Què és l'homeòstasi? (What is homeostasis?)</p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 2.0, "html": "<p>Escriu dos exemples d'homeòstasi. (Write two examples.)</p>\n<ol>\n<li>\n<hr />\n</li>\n<li>\n<hr />\n</li>\n</ol>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Fa molta calor. Què fa el cos per mantenir la temperatura a uns 37 °C? Explica per què ajuda. (It is very hot. What does the body do to keep about 37 °C, and why does it help?)</p>", "maths": false}], "footer": "<p><em>Revisa: has contestat totes les preguntes? Has usat la paraula «estables» o «mantenir» a la definició?</em></p>", "rule": "", "title": "Test 5 – Homeòstasi"}}, {"id": "bio6", "n": 6, "title": "Estímul i resposta", "sub": "Stimulus and response", "study": null, "learn": "<p><strong>The big idea.</strong> Living things notice what happens around them (and inside them) and react. The thing that changes and is noticed is the <strong>estímul</strong> (stimulus). What the living thing does about it is the <strong>resposta</strong> (response). This is the vital function of <strong>relació</strong>.</p>\n<p><strong>Definitions to learn.</strong></p>\n<ul>\n<li><em>Un estímul és un canvi en l'entorn que un éssér viu pot detectar.</em></li>\n<li><em>Una resposta és la reacció d'un éssér viu davant d'un estímul.</em></li>\n</ul>\n<p><strong>The chain.</strong> estímul (change) → the living thing <strong>detects</strong> it (animals with the senses: sight, hearing, smell, taste, touch) → <strong>resposta</strong> (it moves, grows, hides, sweats…).</p>\n<table>\n<thead>\n<tr>\n<th>Estímul (stimulus)</th>\n<th>Éssér viu</th>\n<th>Resposta (response)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>llum</td>\n<td>planta de mongetes</td>\n<td>La tija creix cap a la llum.</td>\n</tr>\n<tr>\n<td>soroll fort</td>\n<td>gat</td>\n<td>Fuig i s'amaga.</td>\n</tr>\n<tr>\n<td>fred</td>\n<td>persona</td>\n<td>Tremola i es posa un jersei.</td>\n</tr>\n<tr>\n<td>contacte</td>\n<td>mimosa (planta)</td>\n<td>Tanca les fulles.</td>\n</tr>\n<tr>\n<td>olor de menjar</td>\n<td>gos</td>\n<td>Es posa a salivar i s'apropa.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>How to answer an experiment question.</strong> Ask yourself two things: 1) <strong>What changed in the environment?</strong> That is the stimulus. 2) <strong>What did the living thing do?</strong> That is the response.</p>\n<p><strong>Worked example.</strong> A bean seedling grows in a closed box. The box has one small hole on the left side, and sunlight comes in through the hole. After three days the stem is bent towards the hole. The stimulus is <strong>not the hole</strong>: the hole only lets something in. The stimulus is the <strong>light</strong> that enters. The response is that the <strong>stem grows towards the light</strong>.</p>\n<p><strong>Write it in a full sentence:</strong> <em>L'estímul és la llum i la resposta és que la tija creix cap a la llum.</em></p>\n<p><strong>Plants answer stimuli too</strong>, just more slowly than animals.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>What is the stimulus when you take your hand away from a hot pan? And the response?</li>\n<li>Name two stimuli that a dog can detect.</li>\n<li>Write a full sentence with the words \"estímul\" and \"resposta\" for the bean experiment.</li>\n</ol>", "test": {"marks": 8, "minutes": 10, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb frases completes. (Answer with complete sentences.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 2.0, "html": "<p>Defineix: (Define.)</p>\n<p>a) estímul: <span class=\"blank\" data-n=\"44\"></span></p>\n<p>b) resposta: <span class=\"blank\" data-n=\"44\"></span></p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 4.0, "html": "<p>Escriu l'estímul i la resposta. (Write the stimulus and the response.)</p>\n<p>a) Un gat sent un soroll molt fort i s'amaga sota el llit.</p>\n<p>Estímul: <span class=\"blank\" data-n=\"20\"></span>   Resposta: <span class=\"blank\" data-n=\"20\"></span></p>\n<p>b) Una planta creix dins d'una caixa tancada. La caixa té un forat per on entra la llum del sol. La tija creix cap al forat.</p>\n<p>Estímul: <span class=\"blank\" data-n=\"20\"></span>   Resposta: <span class=\"blank\" data-n=\"20\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Vertader o fals? Si és fals, corregeix-ho. (True or false? If false, correct it.)</p>\n<p>a) Només els animals responen als estímuls. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) La llum, el soroll i el fred són estímuls. <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false, "tf": true, "tfx": true}], "footer": "<p><em>Revisa: has contestat totes les preguntes? Has escrit l'estímul i la resposta a cada situació?</em></p>", "rule": "", "title": "Test 6 – Estímul i resposta"}}, {"id": "bio7", "n": 7, "title": "Nutrients orgànics i inorgànics", "sub": "Organic and inorganic nutrients", "study": null, "learn": "<p><strong>The big idea.</strong> Food contains <strong>nutrients</strong>: the substances the body uses. There are two families. <strong>Orgànics</strong> are made by living things and contain carbon (they can burn). <strong>Inorgànics</strong> also exist in the non-living world (rocks, sea, air). Learn the list of nutrients, not the chemical symbols.</p>\n<table>\n<thead>\n<tr>\n<th>Nutrient</th>\n<th>Family</th>\n<th>Main function</th>\n<th>Food examples</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>hidrats de carboni</td>\n<td>orgànic</td>\n<td>energy (quick)</td>\n<td>pasta, rice, bread, sugar, fruit</td>\n</tr>\n<tr>\n<td>lípids (greixos)</td>\n<td>orgànic</td>\n<td>energy (store) and protection</td>\n<td>olive oil, butter, nuts</td>\n</tr>\n<tr>\n<td>proteïnes</td>\n<td>orgànic</td>\n<td>build and repair the body (also energy)</td>\n<td>meat, fish, eggs, lentils</td>\n</tr>\n<tr>\n<td>vitamines</td>\n<td>orgànic</td>\n<td>regulate body processes</td>\n<td>fruit, vegetables</td>\n</tr>\n<tr>\n<td>aigua</td>\n<td>inorgànic</td>\n<td>transport, regulate, make up the body</td>\n<td>water, drinks, fruit</td>\n</tr>\n<tr>\n<td>sals minerals</td>\n<td>inorgànic</td>\n<td>build (bones: calcium) and regulate</td>\n<td>salt, milk, vegetables</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Memory split.</strong> Organic = <strong>4</strong> (hidrats de carboni, lípids, proteïnes, vitamines). Inorganic = <strong>2</strong> (aigua, sals minerals).</p>\n<p><strong>The three functions of nutrients.</strong></p>\n<ul>\n<li><strong>Energètica</strong> (energy): hidrats de carboni, lípids, proteïnes.</li>\n<li><strong>Estructural / constructora</strong> (building the body): proteïnes, aigua, sals minerals, lípids.</li>\n<li><strong>Reguladora</strong> (regulating): vitamines, sals minerals, aigua.</li>\n</ul>\n<p><strong>Only three nutrients give energy.</strong> Vitamins, water and mineral salts give <strong>no</strong> energy.</p>\n<p><strong>Three traps to avoid.</strong></p>\n<ol>\n<li><strong>C, H, O and N are chemical elements, not nutrients.</strong> They are the atoms that organic nutrients are made of. Do not write them when the question asks for the types of organic nutrient.</li>\n<li><strong>Salt (NaCl) is a mineral salt, so it is inorganic.</strong></li>\n<li><strong>Oxygen is inorganic</strong> (it is a gas in the air, not an organic nutrient).</li>\n</ol>\n<p><strong>Words.</strong> <em>lípids</em> and <em>greixos</em> mean the same. <em>Hidrats de carboni</em> is also called <em>glúcids</em>. Use the words your teacher used in class.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>List the four organic nutrients.</li>\n<li>Which three nutrients give energy?</li>\n<li>Is salt organic or inorganic?</li>\n</ol>", "test": {"marks": 10, "minutes": 12, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb el nom del nutrient. (Answer with the name of the nutrient.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Escriu si és orgànic o inorgànic. (Write organic or inorganic.)</p>\n<p>a) aigua <span class=\"blank\" data-n=\"12\"></span>   b) proteïnes <span class=\"blank\" data-n=\"12\"></span>   c) sals minerals <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 2.0, "html": "<p>Escriu les tres funcions dels nutrients. (Write the three functions of nutrients.)</p>\n<ol>\n<li><span class=\"blank\" data-n=\"12\"></span>   2. <span class=\"blank\" data-n=\"12\"></span>   3. <span class=\"blank\" data-n=\"12\"></span></li>\n</ol>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 3.0, "html": "<p>Quin és el nutrient principal d'aquest aliment? (What is the main nutrient in this food?)</p>\n<p>a) spaghetti: <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) oli d'oliva: <span class=\"blank\" data-n=\"12\"></span></p>\n<p>c) pollastre: <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Vertader o fals? Si és fals, corregeix-ho. (True or false? If false, correct it.)</p>\n<p>a) El carboni (C), l'hidrogen (H) i l'oxigen (O) són nutrients orgànics. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) La sal (NaCl) és un nutrient orgànic. <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false, "tf": true, "tfx": true}], "footer": "<p><em>Revisa: has contestat totes les preguntes?</em></p>", "rule": "", "title": "Test 7 – Nutrients"}}, {"id": "bio8", "n": 8, "title": "Nutrició autòtrofa i heteròtrofa", "sub": "Autotrophic and heterotrophic nutrition", "study": null, "learn": "<p><strong>The big idea.</strong> Every living thing needs <strong>organic</strong> matter (sugars, fats, proteins). The question is <strong>where it gets it from</strong>. Some living things <strong>make</strong> it; others must <strong>take</strong> it from other living things.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Nutrició autòtrofa</th>\n<th>Nutrició heteròtrofa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Meaning</td>\n<td>They <strong>make</strong> their own organic matter from inorganic matter (water, CO₂, mineral salts).</td>\n<td>They <strong>cannot</strong> make it: they take organic matter from other living things.</td>\n</tr>\n<tr>\n<td>Energy source</td>\n<td>Light (through <strong>fotosíntesi</strong>)</td>\n<td>The organic matter they eat or absorb</td>\n</tr>\n<tr>\n<td>Special part</td>\n<td>Chloroplasts with chlorophyll (green)</td>\n<td>No chloroplasts</td>\n</tr>\n<tr>\n<td>Living things</td>\n<td>plants (trees, grass, cactus), algae, some bacteria (cyanobacteria)</td>\n<td>animals, fungi (mushrooms, yeast), most bacteria, protozoa</td>\n</tr>\n<tr>\n<td>Role in food chain</td>\n<td>producers (base of the chain)</td>\n<td>consumers and decomposers</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Definitions to learn.</strong></p>\n<ul>\n<li><em>La nutrició autòtrofa és la dels éssers vius que fabriquen matèria orgànica a partir de matèria inorgànica.</em></li>\n<li><em>La nutrició heteròtrofa és la dels éssers vius que prenen matèria orgànica d'altres éssers vius.</em></li>\n</ul>\n<p><strong>Easy ways to classify.</strong> Does it have chloroplasts and use light to make food? → autòtrof. Does it eat, or absorb food that other living things made? → heteròtrof.</p>\n<p><strong>Watch out.</strong></p>\n<ul>\n<li><strong>Fungi are heterotrophs.</strong> They have no chloroplasts and do <strong>not</strong> photosynthesise. They absorb food from dead matter (decomposers).</li>\n<li><strong>A cactus is a plant</strong>, so it is an autotroph, even if it has no normal leaves.</li>\n<li><strong>Bacteria</strong> can be either kind: cyanobacteria are autotrophs; most other bacteria are heterotrophs.</li>\n<li>Heterotroph does <strong>not</strong> mean \"carnivore\". Herbívors (herbivores), carnívors (carnivores) and omnívors (omnivores) are all heterotrophs.</li>\n</ul>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Is a mushroom an autotroph or a heterotroph? Why?</li>\n<li>Name three autotrophs and three heterotrophs.</li>\n<li>What does an autotroph use to make organic matter?</li>\n</ol>", "test": {"marks": 8, "minutes": 10, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb frases completes quan et demanen definir. (Use complete sentences for definitions.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 2.0, "html": "<p>Defineix: (Define.)</p>\n<p>a) nutrició autòtrofa: <span class=\"blank\" data-n=\"44\"></span></p>\n<p>b) nutrició heteròtrofa: <span class=\"blank\" data-n=\"44\"></span></p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Escriu si té nutrició autòtrofa o heteròtrofa. (Write autotrophic or heterotrophic.)</p>\n<p>a) cactus <span class=\"blank\" data-n=\"12\"></span>   b) bolet (fong) <span class=\"blank\" data-n=\"12\"></span>   c) vaca <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Els éssers autòtrofs fabriquen matèria orgànica. (Autotrophs make organic matter.)</p>\n<p>a) Quin procés fan? <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) En quin orgànul el fan? <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 1.0, "html": "<p>Vertader o fals? Si és fals, explica per què. (True or false? If false, say why.)</p>\n<p>«Els bolets fan la fotosíntesi.»   <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false, "tf": true, "tfx": true}], "footer": "<p><em>Revisa: has contestat totes les preguntes?</em></p>", "rule": "", "title": "Test 8 – Nutrició autòtrofa i heteròtrofa"}}, {"id": "bio9", "n": 9, "title": "Problemes d'energia dels aliments", "sub": "Food energy problems", "study": null, "learn": "<p><strong>The big idea.</strong> Food contains energy, measured in <strong>kJ</strong> (quilojoules). There are two kinds of problem, and they use different data. Read the data first and ask: <em>is the energy given per 100 g of food, or per 1 g of each nutrient?</em></p>\n<h3>Type A – energy \"per 100 g\" (food label)</h3>\n<p>The label tells the energy in <strong>100 g</strong> of food. If you eat a different amount, scale it.</p>\n<p><strong>kJ = grams menjats × (kJ per 100 g) ÷ 100</strong></p>\n<p>To find the grams that give a certain energy, do the reverse:</p>\n<p><strong>grams = kJ que vols ÷ (kJ per 100 g) × 100</strong></p>\n<p><strong>Why ÷ 100?</strong> The label is for 100 g. If you eat 125 g, you eat 1,25 portions of 100 g. Multiplying by 125 without dividing by 100 gives a number 100 times too big.</p>\n<ul>\n<li><strong>Example A1.</strong> A yoghurt of 125 g has 250 kJ per 100 g. Energy = 250 × 125 ÷ 100 = 31 250 ÷ 100 = <strong>312,5 kJ</strong>.</li>\n<li><strong>Example A2.</strong> A biscuit has 1800 kJ per 100 g. How many grams give 450 kJ? Grams = 450 ÷ 1800 × 100 = 0,25 × 100 = <strong>25 g</strong>.</li>\n</ul>\n<h3>Type B – energy from nutrients (kJ per gram)</h3>\n<p>Values used in class:</p>\n<table>\n<thead>\n<tr>\n<th>Nutrient</th>\n<th>Energy</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>hidrats de carboni</td>\n<td>16,736 kJ per g</td>\n</tr>\n<tr>\n<td>proteïnes</td>\n<td>16,736 kJ per g</td>\n</tr>\n<tr>\n<td>lípids (greixos)</td>\n<td>37,656 kJ per g</td>\n</tr>\n</tbody>\n</table>\n<p>Multiply the grams of each nutrient by its value, then <strong>add them all</strong>. Vitamins, water and mineral salts give no energy.</p>\n<ul>\n<li><strong>Example B1.</strong> A sandwich has 40 g of hidrats de carboni, 10 g of proteïnes and 12 g of lípids. Hidrats: 40 × 16,736 = 669,44 kJ. Proteïnes: 10 × 16,736 = 167,36 kJ. Lípids: 12 × 37,656 = 451,872 kJ. <strong>Total</strong> = 669,44 + 167,36 + 451,872 = <strong>1288,672 kJ</strong>.</li>\n<li><strong>Example B2 (reverse).</strong> How many grams of lípids give 1129,68 kJ? Grams = 1129,68 ÷ 37,656 = <strong>30 g</strong>.</li>\n</ul>\n<h3>The four steps (every problem)</h3>\n<ol>\n<li><strong>Write the data</strong> with units.</li>\n<li><strong>Write the calculation</strong> (not only the answer).</li>\n<li><strong>Finish the problem.</strong> Add the totals, or do the ÷ 100. Most marks are lost by stopping one step early.</li>\n<li><strong>Answer in a sentence with the unit:</strong> <em>La barreta té 640 kJ.</em></li>\n</ol>\n<p><strong>Catalan note.</strong> Use the decimal comma (312,5 kJ). Write <strong>kJ</strong>, not kJ/g, on a final answer.</p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>A juice of 200 g has 180 kJ per 100 g. How many kJ does it have?</li>\n<li>A food has 20 g of lípids. How many kJ is that?</li>\n<li>Why do we divide by 100 in Type A?</li>\n</ol>", "test": {"marks": 12, "minutes": 15, "elements": [{"t": "text", "html": "<p><em>Instruccions: Escriu les dades, el càlcul i la resposta amb la unitat. (Write the data, the calculation and the answer with the unit.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Una barreta de cereals pesa 40 g. L'etiqueta diu 1600 kJ per cada 100 g. Quants kJ té la barreta? (A cereal bar weighs 40 g. The label says 1600 kJ per 100 g. How many kJ does the bar have?)</p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Una pasta té 1500 kJ per cada 100 g. Quants grams n'has de menjar per obtenir 600 kJ? (How many grams give 600 kJ?)</p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 4.0, "html": "<p>Un plat té 30 g d'hidrats de carboni, 20 g de proteïnes i 10 g de lípids. Quanta energia té en total? Fes servir: hidrats de carboni i proteïnes 16,736 kJ per g; lípids 37,656 kJ per g. (How much energy in total? Use the values above.)</p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Quants grams d'hidrats de carboni donen 836,8 kJ? Fes servir 16,736 kJ per g. (How many grams of carbohydrate give 836,8 kJ?)</p>", "maths": false}], "footer": "<p><em>Revisa: has acabat tots els càlculs? Has escrit la unitat (kJ o g) i la coma decimal?</em></p>", "rule": "Calculator allowed", "title": "Test 9 – Energia dels aliments"}}, {"id": "bio10", "n": 10, "title": "La respiració cel·lular i la fotosíntesi", "sub": "Cellular respiration and photosynthesis", "study": null, "learn": "<p><strong>The big idea.</strong> These are two opposite processes. <strong>Fotosíntesi</strong> <em>builds</em> organic matter (glucose) and stores light energy in it. <strong>Respiració cel·lular</strong> <em>breaks down</em> organic matter (glucose) and releases its energy so the cell can live. Plants do <strong>both</strong>.</p>\n<p><strong>Phone analogy.</strong> A solar charger (light) charges a battery (glucose). The phone does not run on the sunlight; it runs on the <strong>battery</strong>. In the same way a plant stores sunlight in glucose (fotosíntesi), and its cells then get their energy by using that glucose (respiració cel·lular). No sunlight, no CO₂ and no water give energy directly: only organic matter does.</p>\n<p><strong>The two schemes (learn them in this form).</strong></p>\n<table>\n<thead>\n<tr>\n<th>Process</th>\n<th>Scheme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fotosíntesi</strong></td>\n<td>aigua + diòxid de carboni (CO₂) → <em>(llum + clorofil·la)</em> → glucosa + oxigen (O₂)</td>\n</tr>\n<tr>\n<td><strong>Respiració cel·lular</strong></td>\n<td>glucosa + oxigen (O₂) → diòxid de carboni (CO₂) + aigua + <strong>energia</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Side by side.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Fotosíntesi</th>\n<th>Respiració cel·lular</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Where in the cell</td>\n<td><strong>cloroplasts</strong></td>\n<td><strong>mitocondris</strong></td>\n</tr>\n<tr>\n<td>Who does it</td>\n<td>plants, algae, some bacteria (autotrophs)</td>\n<td><strong>all</strong> living things: animals, fungi <strong>and plants</strong></td>\n</tr>\n<tr>\n<td>When</td>\n<td>only with light</td>\n<td>day and night</td>\n</tr>\n<tr>\n<td>Uses</td>\n<td>inorganic matter (water, CO₂) + light</td>\n<td>organic matter (glucose) + oxygen</td>\n</tr>\n<tr>\n<td>Makes</td>\n<td>organic matter (glucose) + oxygen</td>\n<td>CO₂ + water + energy</td>\n</tr>\n<tr>\n<td>Type of change</td>\n<td>inorganic → organic</td>\n<td>organic → inorganic</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Gases in a plant.</strong> In the day with light: it takes in CO₂ and gives out O₂ (photosynthesis is stronger). At night: it takes in O₂ and gives out CO₂ (only respiration).</p>\n<p><strong>Three mistakes seen in earlier tests.</strong></p>\n<ol>\n<li>\"Plants get their energy from the Sun / from CO₂.\" <strong>No.</strong> They store the Sun's light in glucose and get energy from respiring that glucose.</li>\n<li>\"Plants do not respire.\" <strong>They do</strong>, every hour of the day.</li>\n<li>\"Fungi photosynthesise.\" <strong>No.</strong> They have no chloroplasts.</li>\n</ol>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>Which process happens in the mitochondria?</li>\n<li>Does a tree respire at night? Does it photosynthesise at night?</li>\n<li>Why is \"inorganic → organic\" the key idea of photosynthesis?</li>\n</ol>", "test": {"marks": 12, "minutes": 15, "elements": [{"t": "text", "html": "<p><em>Instruccions: Completa amb les paraules que falten. (Fill in the missing words.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Completa l'esquema de la fotosíntesi. (Complete the photosynthesis scheme.)</p>\n<p><span class=\"blank\" data-n=\"12\"></span> + <span class=\"blank\" data-n=\"12\"></span> → <em>(llum)</em> → glucosa + <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Completa l'esquema de la respiració cel·lular. (Complete the cellular respiration scheme.)</p>\n<p>glucosa + <span class=\"blank\" data-n=\"12\"></span> → <span class=\"blank\" data-n=\"12\"></span> + aigua + <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>On es fa cada procés? Escriu el nom de l'orgànul. (In which organelle?)</p>\n<p>a) fotosíntesi: <span class=\"blank\" data-n=\"12\"></span>   b) respiració cel·lular: <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 4.0, "html": "<p>Vertader o fals? Si és fals, corregeix-ho. (True or false? If false, correct it.)</p>\n<p>a) Les plantes també fan la respiració cel·lular. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) Els animals fan la fotosíntesi. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>c) La fotosíntesi transforma matèria inorgànica en matèria orgànica. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>d) Les plantes fan la fotosíntesi de dia i la respiració només de nit. <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false, "tf": true, "tfx": true}], "footer": "<p><em>Revisa: has contestat totes les preguntes? Has corregit les frases falses?</em></p>", "rule": "", "title": "Test 10 – Respiració i fotosíntesi"}}, {"id": "bio11", "n": 11, "title": "La reproducció", "sub": "Reproduction", "study": null, "learn": "<p><strong>The big idea.</strong> Reproduction is the vital function that makes <strong>new living things</strong>, so the species does not disappear. There are two types: <strong>sexual</strong> and <strong>asexual</strong>. The difference is simple: <em>how many parents are needed, and are the children the same or different?</em></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Reproducció sexual</th>\n<th>Reproducció asexual</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Progenitors (parents)</td>\n<td><strong>2</strong> (one male, one female)</td>\n<td><strong>1</strong></td>\n</tr>\n<tr>\n<td>Gàmetes (reproductive cells)</td>\n<td><strong>Yes</strong>: espermatozoide (male) + òvul (female)</td>\n<td><strong>No</strong></td>\n</tr>\n<tr>\n<td>Fecundació (the gametes join)</td>\n<td>Yes: makes a <strong>zigot</strong> (first cell of the new being)</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Descendents (offspring)</td>\n<td><strong>Similar but different</strong> from the parents and from each other</td>\n<td><strong>Identical</strong> to the parent (clons)</td>\n</tr>\n<tr>\n<td>Variability</td>\n<td><strong>Yes</strong> (helps the species survive changes)</td>\n<td><strong>No</strong></td>\n</tr>\n<tr>\n<td>Speed</td>\n<td>Slower</td>\n<td>Fast, many descendents in a short time</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td>humans, dogs, birds, most plants (flowers)</td>\n<td>bacteria, yeast, strawberry plants, starfish</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Definitions to learn.</strong></p>\n<ul>\n<li><em>La reproducció sexual és la que necessita dos progenitors i la unió de gàmetes. Els descendents són diferents dels progenitors.</em></li>\n<li><em>La reproducció asexual és la que necessita un sol progenitor i no té gàmetes. Els descendents són idèntics al progenitor.</em></li>\n</ul>\n<p><strong>Main kinds of asexual reproduction</strong> (recognise the name and one example).</p>\n<table>\n<thead>\n<tr>\n<th>Kind</th>\n<th>What happens</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>bipartició</td>\n<td>The cell splits into two equal cells.</td>\n<td>bacteria</td>\n</tr>\n<tr>\n<td>gemmació</td>\n<td>A small bud grows on the parent and separates.</td>\n<td>yeast, hydra</td>\n</tr>\n<tr>\n<td>fragmentació</td>\n<td>A piece of the body grows into a whole new individual.</td>\n<td>starfish, planarian worm</td>\n</tr>\n<tr>\n<td>esporulació</td>\n<td>The parent releases spores that grow into new individuals.</td>\n<td>mushrooms, ferns</td>\n</tr>\n<tr>\n<td>reproducció vegetativa</td>\n<td>A part of a plant (runner or tuber) grows into a new plant.</td>\n<td>strawberry, potato</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Trick to remember.</strong> <em>Sexual = Several (two) parents, Surprising children (different). Asexual = A single parent, copies (clones).</em></p>\n<h3>Quick check (practice)</h3>\n<ol>\n<li>How many parents does each type need?</li>\n<li>Name the two gametes in sexual reproduction.</li>\n<li>A strawberry plant grows a runner and makes a new plant. Which type is it?</li>\n</ol>", "test": {"marks": 10, "minutes": 12, "elements": [{"t": "text", "html": "<p><em>Instruccions: Respon amb paraules curtes o frases completes. (Answer with short words or complete sentences.)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 4.0, "html": "<p>Completa la taula. (Complete the table.)</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Reproducció sexual</th>\n<th>Reproducció asexual</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nombre de progenitors</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>Descendents (iguals o diferents?)</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 2.0, "html": "<p>Quines dues cèl·lules s'uneixen en la reproducció sexual? (Which two cells join in sexual reproduction?)</p>\n<p><span class=\"blank\" data-n=\"12\"></span>   i   <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Escriu si és reproducció sexual o asexual. (Write sexual or asexual.)</p>\n<p>a) Un bacteri es divideix en dos bacteris. <span class=\"blank\" data-n=\"12\"></span></p>\n<p>b) Una gossa i un gos tenen cadells. <span class=\"blank\" data-n=\"12\"></span></p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Escriu un avantatge de cada tipus de reproducció. (Write one advantage of each type.)</p>\n<p>a) sexual: <span class=\"blank\" data-n=\"44\"></span></p>\n<p>b) asexual: <span class=\"blank\" data-n=\"44\"></span></p>", "maths": false}], "footer": "<p><em>Revisa: has contestat totes les preguntes?</em></p>", "rule": "", "title": "Test 11 – Reproducció"}}], "extras": []}, {"id": "cat", "name": "Català", "tag": "Catalan", "modules": [{"id": "cat1", "n": 1, "title": "Comprensió lectora", "sub": "reading comprehension", "study": null, "learn": "<p><strong>What to know.</strong> To answer a reading question well: read the text twice, underline the clues, and answer in a full sentence that uses words from the text. The textbook units teach these ideas:</p>\n<table>\n<thead>\n<tr>\n<th>Terme</th>\n<th>English</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>fet desencadenant</td>\n<td>the event that starts the story's problem and changes the main character's life</td>\n<td><em>L'avi perd les claus.</em></td>\n</tr>\n<tr>\n<td>arc narratiu</td>\n<td>how tension rises to a high point, then the story ends</td>\n<td>start → problem → clímax → final</td>\n</tr>\n<tr>\n<td>clímax</td>\n<td>the moment of highest tension</td>\n<td><em>El Pau obre la porta del galliner.</em></td>\n</tr>\n<tr>\n<td>gir narratiu</td>\n<td>a fact or decision that makes the hero start an adventure</td>\n<td><em>Rep una carta inesperada.</em></td>\n</tr>\n<tr>\n<td>inferir</td>\n<td>to work out something the text does not say directly (\"read between the lines\")</td>\n<td><em>Si ploren, estan tristos.</em></td>\n</tr>\n<tr>\n<td>sentit despectiu</td>\n<td>a word that sounds insulting or negative</td>\n<td><em>una barraca</em> (for a house)</td>\n</tr>\n<tr>\n<td>emissor / receptor</td>\n<td>the person who sends / receives the message</td>\n<td>writer / reader</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Three question types.</strong> (1) <em>Literal</em>: the answer is written in the text. (2) <em>Inference</em>: the answer is a conclusion from clues; say which clue. (3) <em>Opinion</em>: say what you think and give a reason with <em>perquè</em>.</p>\n<p><strong>Practice.</strong> Read the text, then answer in full sentences.</p>\n<blockquote>\n<p><strong>El mapa de l'avi</strong></p>\n<p>Cada estiu, el Pau anava a casa de l'avi Josep, en un poble petit de muntanya. Aquell any, però, l'avi estava trist: havia perdut les claus del magatzem vell i no podia entrar-hi.</p>\n<p>—Tranquil, avi —va dir el Pau—. Les trobarem.</p>\n<p>Van buscar sota els coixins, dins les sabates i a la butxaca de l'abric, però res. Llavors el Pau va recordar que, la nit abans, l'avi havia sortit a donar menjar a les gallines. Va córrer al galliner i, entre la palla, va veure una cosa que brillava. Eren les claus!</p>\n<p>—Com ho has sabut? —va preguntar l'avi, molt sorpès.</p>\n<p>—Només he pensat com si fos tu —va riure el Pau.</p>\n<p>L'avi va obrir el magatzem i, al fons, va aparèixer una caixa plena de fotografies antigues. Aquella tarda no van parar de mirar-les i de riure. Quan va arribar l'hora de dormir, l'avi va dir: «Avui he perdut unes claus, però he trobat un tresor.»</p>\n</blockquote>\n<ol>\n<li>Quin és el fet desencadenant de la història? (a) L'avi perd les claus del magatzem. (b) El Pau troba una caixa. (c) L'avi va a dormir.</li>\n<li>Posa en ordre aquests fets (1 a 4): <span class=\"blank\" data-n=\"3\"></span> El Pau troba les claus. <span class=\"blank\" data-n=\"3\"></span> L'avi s'adona que no té les claus. <span class=\"blank\" data-n=\"3\"></span> Busquen sota els coixins. <span class=\"blank\" data-n=\"3\"></span> Miren fotografies.</li>\n<li>Vertader o fals? Si és fals, corregeix-ho. (a) El poble de l'avi és a la platja. (b) Les claus eren al galliner. (c) L'avi no sabia com les havia trobat el Pau.</li>\n<li>Què vol dir <em>magatzem</em>? (a) un lloc on es guarden coses (b) un lloc on es dorm (c) un lloc on es cuina. I què és un <em>galliner</em>?</li>\n<li>Quin és el clímax (el moment amb més tensió)? Explica-ho amb una frase completa.</li>\n<li>Inferència: què podem pensar del Pau? Escriu una frase i digues quina frase del text ho mostra.</li>\n<li>Què vol dir l'última frase de l'avi («he trobat un tresor»)? Explica-ho amb les teves paraules.</li>\n<li>Escriu un altre títol per a la història i explica per què el trieu.</li>\n</ol>", "test": {"marks": 10, "minutes": 10, "elements": [{"t": "text", "html": "<p>Llegeix el text i respon.</p>"}, {"t": "text", "html": "<blockquote>\n<p><strong>La ràdio de l'escola</strong></p>\n<p>Quan la Laia va saber que l'escola tindria una ràdio, va aixecar la mà abans que la professora acabés de parlar.</p>\n<p>—Jo vull ser la locutora! —va dir amb un somriure enorme.</p>\n<p>Però el primer dia, quan va veure el micròfon, se li va fer un nus a la gola. Les mans li tremolaven i la veu gairebé no li sortia.</p>\n<p>—Respira profundament i imagina que parles només amb la teva àvia —li va xiuxiuejar en Pau, el tècnic de so.</p>\n<p>La Laia va agafar aire i va començar a llegir. Poc a poc, la veu li va tornar més clara i més segura. Quan va acabar, tota la classe va aplaudir.</p>\n<p>Des d'aquell dia, la Laia ja no tenia por del micròfon. Cada divendres, abans de començar, feia una mica de broma amb en Pau per rebaixar els nervis.</p>\n</blockquote>"}, {"t": "q", "id": "q1", "n": "1", "marks": 1.0, "html": "<p>Quin és el fet desencadenant de la història? Marca una opció.</p>\n<ul>\n<li>(a) La Laia sap que l'escola tindrà una ràdio.</li>\n<li>(b) En Pau ajuda la Laia amb el micròfon.</li>\n<li>(c) Tota la classe aplaudeix la Laia.</li>\n</ul>", "maths": false, "kind": "mc", "stem": "<p>Quin és el fet desencadenant de la història? Marca una opció.</p>", "opts": [{"k": "a", "t": "La Laia sap que l'escola tindrà una ràdio."}, {"k": "b", "t": "En Pau ajuda la Laia amb el micròfon."}, {"k": "c", "t": "Tota la classe aplaudeix la Laia."}]}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Vertader (V) o fals (F)?</p>\n<ul>\n<li>(a) La Laia va dubtar abans de dir que volia ser locutora. <span class=\"blank\" data-n=\"4\"></span></li>\n<li>(b) En Pau és el tècnic de so. <span class=\"blank\" data-n=\"4\"></span></li>\n<li>(c) Al final, la Laia continua tenint molta por del micròfon. <span class=\"blank\" data-n=\"4\"></span></li>\n</ul>", "maths": false, "tf": true, "tfx": false}, {"t": "q", "id": "q3", "n": "3", "marks": 1.0, "html": "<p>Què vol dir «se li va fer un nus a la gola»? Marca una opció.</p>\n<ul>\n<li>(a) Tenia mal de coll.</li>\n<li>(b) Estava molt nerviosa.</li>\n<li>(c) Tenia gana.</li>\n</ul>", "maths": false, "kind": "mc", "stem": "<p>Què vol dir «se li va fer un nus a la gola»? Marca una opció.</p>", "opts": [{"k": "a", "t": "Tenia mal de coll."}, {"k": "b", "t": "Estava molt nerviosa."}, {"k": "c", "t": "Tenia gana."}]}, {"t": "q", "id": "q4", "n": "4", "marks": 1.0, "html": "<p>Què podem inferir sobre com és en Pau? Escriu una frase i digues quina part del text ho mostra.</p>", "maths": false}, {"t": "q", "id": "q5", "n": "5", "marks": 2.0, "html": "<p>Quin és el clímax de la història (el moment amb més tensió)? Explica-ho amb una frase completa.</p>", "maths": false}, {"t": "q", "id": "q6", "n": "6", "marks": 2.0, "html": "<p>Resumeix la història en dues frases: qui és la protagonista, què li passa i com acaba.</p>", "maths": false}], "footer": "", "rule": "", "title": "Check 1 · Comprensió lectora"}}, {"id": "cat2", "n": 2, "title": "Les categories lèxiques, els sintagmes i les oracions", "sub": "", "study": null, "learn": "<p><strong>1. The ten lèxical categories (word classes).</strong> Every word belongs to one. To find it, ask three things: what does it <em>mean</em>, what <em>forms</em> does it have (does it change for gender, number, tense?), and what is its <em>function</em> in the sentence?</p>\n<table>\n<thead>\n<tr>\n<th>Categoria</th>\n<th>English</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>nom (n)</td>\n<td>noun</td>\n<td><em>clau, Harry, amistat</em></td>\n</tr>\n<tr>\n<td>adjectiu (adj)</td>\n<td>adjective</td>\n<td><em>petit, simpàtic</em></td>\n</tr>\n<tr>\n<td>determinant (det)</td>\n<td>determiner (article, \"this\", \"my\")</td>\n<td><em>el, aquest, la meva</em></td>\n</tr>\n<tr>\n<td>quantificador (q)</td>\n<td>quantifier (an amount)</td>\n<td><em>molt, poc, tres</em></td>\n</tr>\n<tr>\n<td>pronom (pron)</td>\n<td>pronoun (replaces a noun)</td>\n<td><em>jo, tu, ell, ens</em></td>\n</tr>\n<tr>\n<td>verb (v)</td>\n<td>verb (an action or state)</td>\n<td><em>canta, som, vam anar</em></td>\n</tr>\n<tr>\n<td>adverbi (adv)</td>\n<td>adverb (how / when / where)</td>\n<td><em>lentament, sempre, aquí</em></td>\n</tr>\n<tr>\n<td>preposició (prep)</td>\n<td>preposition (links words)</td>\n<td><em>a, de, amb, sense, per</em></td>\n</tr>\n<tr>\n<td>conjunció (conj)</td>\n<td>conjunction (links words or sentences)</td>\n<td><em>i, però, perquè, o</em></td>\n</tr>\n<tr>\n<td>interjecció (interj)</td>\n<td>interjection (a cry of feeling)</td>\n<td><em>ai!, ostres!, visca!</em></td>\n</tr>\n</tbody>\n</table>\n<p><strong>2. Els sintagmes (phrases).</strong> A sintagma is a group of words around one key word, the <strong>nucli</strong> (core). The type of sintagma is the type of its nucli.</p>\n<table>\n<thead>\n<tr>\n<th>Sintagma</th>\n<th>Nucli és…</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SN (nominal)</td>\n<td>un nom</td>\n<td><em>la teva espasa de pirata</em></td>\n</tr>\n<tr>\n<td>SV (verbal)</td>\n<td>un verb</td>\n<td><em>penso en tu cada minut</em></td>\n</tr>\n<tr>\n<td>SAdj (adjectival)</td>\n<td>un adjectiu</td>\n<td><em>força dolorós</em></td>\n</tr>\n<tr>\n<td>SAdv (adverbial)</td>\n<td>un adverbi</td>\n<td><em>molt lentament</em></td>\n</tr>\n<tr>\n<td>SPrep (preposicional)</td>\n<td>una preposició</td>\n<td><em>sense tu</em></td>\n</tr>\n</tbody>\n</table>\n<p>Inside a sintagma, the word <em>before</em> the nucli that goes with it is the <strong>especificador</strong>; the words <em>after</em> it that add information are <strong>complements</strong>. Example: <em>una</em> (especificador) + <em>situació</em> (nucli) + <em>difícil</em> (complement).</p>\n<p><strong>3. Les oracions (sentences).</strong> An oració has complete meaning and one tone of voice (<strong>entonació</strong>). It usually has two parts that agree in person and number: the <strong>subjecte</strong> (an SN: who or what) and the <strong>predicat</strong> (an SV: what is said about it). <em>La meva mare</em> (subjecte) <em>es va entusiasmar</em> (predicat). Sometimes the subject is not written (<em>Penso en tu</em> = \"jo\" is understood).</p>\n<p><strong>Modalitat (the speaker's purpose):</strong> declarativa (states: <em>Fa fred.</em>), interrogativa (asks: <em>Fa fred?</em>), imperativa (orders or asks: <em>Tanca la porta.</em>), exclamativa (shows a feeling: <em>Quin fred que fa!</em>). An oració can express a <strong>procés</strong> (an action), an <strong>estat</strong> or a <strong>característica</strong>.</p>\n<p><strong>Practice.</strong></p>\n<ol>\n<li>Escriu la categoria lèxica de la paraula en negreta: (a) <strong>Aquell</strong> gos és negre. (b) La Clara <strong>toca</strong> el piano. (c) Hi vaig anar <strong>amb</strong> el meu pare. (d) Vull te <strong>o</strong> llet. (e) <strong>Ostres!</strong> Què passa? (f) El gat dorm <strong>molt</strong>. (g) <strong>Ell</strong> viu a Girona.</li>\n<li>Digues de quin tipus és cada sintagma (SN, SV, SAdj, SAdv, SPrep): (a) <em>els bons records d'infància</em> (b) <em>molt senzillament</em> (c) <em>vam descobrir tantes coses</em> (d) <em>sota la taula</em> (e) <em>força alt</em>.</li>\n<li>Analitza <em>tantes coses boniques</em>: especificador, nucli, complement.</li>\n<li>Escriu el subjecte i el predicat: (a) <em>Els meus cosins arriben demà.</em> (b) <em>La professora de música canta molt bé.</em></li>\n<li>Digues la modalitat: (a) <em>Vols venir al cinema?</em> (b) <em>Quin gol més bonic!</em> (c) <em>Calla ara mateix.</em> (d) <em>Demà plourà.</em></li>\n</ol>", "test": {"marks": 10, "minutes": 10, "elements": [{"t": "q", "id": "q1", "n": "1", "marks": 5.0, "html": "<p>Escriu la categoria lèxica (nom, adjectiu, determinant, quantificador, pronom, verb, adverbi, preposició, conjunció, interjecció) de la paraula en negreta.</p>\n<ul>\n<li>(a) <strong>Aquests</strong> llibres són nous.</li>\n<li>(b) La Marta <strong>canta</strong> molt bé.</li>\n<li>(c) Vaig anar al cinema <strong>amb</strong> la meva àvia.</li>\n<li>(d) Vull un pastís <strong>i</strong> un suc.</li>\n<li>(e) <strong>Uf!</strong> Quina calor!</li>\n</ul>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Digues de quin tipus és cada sintagma (SN, SV, SAdj, SAdv o SPrep):</p>\n<ul>\n<li>(a) <em>els meus amics de l'escola</em></li>\n<li>(b) <em>molt lentament</em></li>\n<li>(c) <em>vam descobrir tantes coses</em></li>\n</ul>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<ul>\n<li>(a) Escriu el subjecte i el predicat d'aquesta oració: <em>La meva germana gran toca el violí cada dia.</em> (1 punt)</li>\n<li>(b) Digues la modalitat (declarativa, interrogativa, imperativa o exclamativa) de: <em>Tanca la porta, si us plau.</em> (1 punt)</li>\n</ul>", "maths": false}], "footer": "", "rule": "", "title": "Check 2 · Categories lèxiques, sintagmes i oracions"}}, {"id": "cat3", "n": 3, "title": "El nom", "sub": "the noun", "study": null, "learn": "<p><strong>1. Propietats.</strong> Meaning: a nom names a person, animal, plant, object or idea. Form: it changes for <strong>gènere</strong> (masculine / feminine) and <strong>nombre</strong> (singular / plural): <em>noi, noia, nois, noies</em>. Function: it is the <strong>nucli</strong> of the sintagma nominal.</p>\n<p><strong>2. Classes de noms.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Classe</th>\n<th>English</th>\n<th>Exemple</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>comú</td>\n<td>common: any member of a class</td>\n<td><em>noia, ciutat</em></td>\n</tr>\n<tr>\n<td>propi</td>\n<td>proper: one unique person or place (antropònims = people, topònims = places)</td>\n<td><em>Paula, Menorca</em></td>\n</tr>\n<tr>\n<td>concret</td>\n<td>you can touch or see it</td>\n<td><em>pescador, rosa</em></td>\n</tr>\n<tr>\n<td>abstracte</td>\n<td>an idea, quality or feeling</td>\n<td><em>veritat, calma</em></td>\n</tr>\n<tr>\n<td>individual</td>\n<td>one single thing (singular)</td>\n<td><em>alumne, ovella</em></td>\n</tr>\n<tr>\n<td>col·lectiu</td>\n<td>a group (singular)</td>\n<td><em>alumnat, ramat</em></td>\n</tr>\n<tr>\n<td>comptable</td>\n<td>you can count it: <em>tres roses</em></td>\n<td><em>rosa, setrill</em></td>\n</tr>\n<tr>\n<td>no comptable</td>\n<td>you cannot count it; use a quantity word: <em>poca farina, un quilo de sal</em></td>\n<td><em>farina, oli</em></td>\n</tr>\n</tbody>\n</table>\n<p>Individual → col·lectiu pairs: ovella → ramat, arbre → bosc, abella → eixam, músic → orquestra, vaixell → flota.</p>\n<p><strong>3. Gènere.</strong> The article shows the gender: <em>el costum</em> (m.), <em>la dent</em> (f.). Learn these patterns:</p>\n<ul>\n<li>Two forms (masculine → feminine): nebot → neboda, amic → amiga, alcalde → alcaldessa, abello<strong>t</strong> → abella, psicòleg → psicòloga, actor → actriu, poeta → poetessa, advocat → advocada.</li>\n<li>Different words (<strong>heterònims</strong>): pare → mare, home → dona, gall → gallina, boc → cabra, cavall → egua, porc → truja, ase → somera.</li>\n<li>Same form for both (<strong>invariables</strong>): <em>el / la cantant, periodista, conserge, pilot, gimnasta</em>.</li>\n<li>Some animals have one form only: <em>una balena mascle / una balena femella</em>.</li>\n</ul>\n<p><strong>4. Nombre.</strong> Plural is usually <em>-s</em> or <em>-es</em>. Watch these:</p>\n<ul>\n<li>Invariable in <em>-us</em>: <em>el fetus → els fetus; el focus → els focus; el virus → els virus; el globus → els globus</em>.</li>\n<li>Variable in <em>-u</em>: <em>la tribu → les tribus; el ritu → els ritus; l'individu → els individus; el residu → els residus</em>.</li>\n<li>Some nouns have no singular or only one form: <em>les tisores, els pantalons</em>.</li>\n</ul>\n<p><strong>5. Same word, different gender, different meaning.</strong> This is where Spanish can confuse him.</p>\n<table>\n<thead>\n<tr>\n<th>Masculí</th>\n<th>Femí</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>el clau (iron nail)</td>\n<td>la clau (key for a lock)</td>\n</tr>\n<tr>\n<td>el pols (heartbeat)</td>\n<td>la pols (dust)</td>\n</tr>\n<tr>\n<td>el son (the act of sleeping)</td>\n<td>la son (feeling sleepy)</td>\n</tr>\n<tr>\n<td>el fi (the aim)</td>\n<td>la fi (the end)</td>\n</tr>\n<tr>\n<td>el llum (the lamp)</td>\n<td>la llum (the light)</td>\n</tr>\n<tr>\n<td>el pudor (shame)</td>\n<td>la pudor (a bad smell)</td>\n</tr>\n<tr>\n<td>un gerro (small, for flowers)</td>\n<td>una gerra (big, for juice)</td>\n</tr>\n<tr>\n<td>un plat (a dish)</td>\n<td>una plata (a big serving dish)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Practice.</strong></p>\n<ol>\n<li>Fes una taula amb tres columnes (nom, comú/propi, concret/abstracte) per a: <em>Montserrat, amistat, gat, Girona, por, taula</em>.</li>\n<li>Escriu el femení: (a) alcalde (b) actor (c) boc (d) psicòleg (e) el pilot (can it change?).</li>\n<li>Escriu el plural: (a) el virus (b) la tribu (c) el focus (d) l'individu.</li>\n<li>Tria l'article correcte (el / la): (a) Necessito <span class=\"blank\" data-n=\"3\"></span> clau per obrir la porta. (b) El fuster ha clavat <span class=\"blank\" data-n=\"3\"></span> clau a la paret. (c) <span class=\"blank\" data-n=\"3\"></span> son em tanca els ulls: vull anar al llit. (d) <span class=\"blank\" data-n=\"3\"></span> fi d'aquesta campanya és ajudar els malalts. (e) Han apagat <span class=\"blank\" data-n=\"3\"></span> llum del saló.</li>\n<li>Escriu el nom col·lectiu de: (a) ovella (b) arbre (c) abella (d) vaixell.</li>\n<li>Comptable o no comptable? Posa «poc / poca» o «tres» davant de: (a) farina (b) llibre (c) oli (d) taronja.</li>\n</ol>", "test": {"marks": 10, "minutes": 10, "elements": [{"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Completa la taula: per a cada nom escriu si és comú o propi i si és concret o abstracte.</p>\n<table>\n<thead>\n<tr>\n<th>Nom</th>\n<th>Comú / propi</th>\n<th>Concret / abstracte</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Marc</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>llibertat</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>cadira</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>", "maths": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Escriu el femení de: (a) advocat (b) cavall (c) poeta.</p>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Escriu el plural de: (a) el fetus (b) el ritu.</p>", "maths": false}, {"t": "q", "id": "q4", "n": "4", "marks": 2.0, "html": "<p>Escriu l'article correcte (<em>el</em> o <em>la</em>): (a) He escombrat <span class=\"blank\" data-n=\"4\"></span> pols dels mobles. (b) El metge m'ha pres <span class=\"blank\" data-n=\"4\"></span> pols.</p>", "maths": false}], "footer": "", "rule": "", "title": "Check 3 · El nom"}}, {"id": "cat4", "n": 4, "title": "Literatura oral i escrita, els gèneres literaris", "sub": "", "study": null, "learn": "<p><strong>1. What is literature?</strong> La literatura és l'art de dir coses de manera creativa i bella amb les paraules. It can be in <strong>vers</strong> (lines with rhythm, often rhyme, grouped in <strong>estrofes</strong>) or in <strong>prosa</strong> (ordinary running text, no fixed metre).</p>\n<p><strong>2. Literatura oral vs literatura escrita.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Literatura oral</th>\n<th>Literatura escrita</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>How it travels</td>\n<td>by voice, learned by heart; an <strong>orador</strong> recites it</td>\n<td>by writing; before printing, <strong>copistes</strong> copied books by hand; later the <strong>impremta</strong> (printing press)</td>\n</tr>\n<tr>\n<td>Author</td>\n<td>an<strong>ònima</strong> (nobody knows who made it)</td>\n<td><strong>d'autor</strong> (name on the cover)</td>\n</tr>\n<tr>\n<td>Versions</td>\n<td><strong>diverses versions</strong>: each teller changes it</td>\n<td><strong>versió única</strong>: the written text stays fixed</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td>rondalles, cançons populars, contes tradicionals</td>\n<td>novel·les, poemes d'un poeta, obres de teatre signades</td>\n</tr>\n</tbody>\n</table>\n<p>Oral works that are anonymous and shared by a whole people are called <strong>patrimoni popular</strong> (popular heritage).</p>\n<p><strong>3. Els gèneres literaris.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Gènere</th>\n<th>What it is</th>\n<th>Types</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Poesia</strong> (in vers)</td>\n<td>uses a creative language with rhythm and rhyme</td>\n<td><strong>lírica</strong>: the poet expresses a deep feeling or thought. <strong>Èpica</strong>: the poet tells a legendary or fantastic story of exceptional heroes</td>\n</tr>\n<tr>\n<td><strong>Narrativa</strong> (usually prose)</td>\n<td>a narrator tells real or imagined events about characters</td>\n<td><strong>curta</strong> (short story, few simple characters); <strong>llarga</strong> (novel, a long story with complex characters)</td>\n</tr>\n<tr>\n<td><strong>Teatre</strong></td>\n<td>a human conflict told through <strong>diàlegs</strong>, performed by <strong>actors i actrius</strong> on an <strong>escenari</strong></td>\n<td><strong>tragèdia</strong>: serious, ends badly. <strong>Comèdia</strong>: funny, ends happily. <strong>Drama</strong>: realistic, ending uncertain</td>\n</tr>\n<tr>\n<td><strong>Assaig</strong> (prose)</td>\n<td>the author gives opinions and thoughts about a topic, with a literary aim</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Practice.</strong></p>\n<ol>\n<li>Vertader o fals? (a) La literatura oral es transmet de memòria. (b) Una obra de literatura oral té sempre un sol autor conegut. (c) Els copistes copiaven els llibres a mà abans de la impremta. (d) Un text escrit sol tenir moltes versions diferents.</li>\n<li>Llegeix cada fragment i escriu el gènere literari (poesia lírica, poesia èpica, narrativa curta, teatre o assaig):</li>\n</ol>\n<blockquote>\n<p><strong>Text A</strong> Plou damunt la ciutat, i dins meu hi ha un racó on només hi viu la tristesa.</p>\n<p><strong>Text B</strong> Hi havia una vegada una tortuga que volia volar. Cada dia pujava a la roca més alta i s'hi llançava, però sempre queia a l'herba. Un dia, un ocell la va agafar amb les urpes i la va portar pel cel. «Ja puc volar!», va cridar la tortuga.</p>\n<p><strong>Text C</strong> MARIA: (rient) Has vist el barret del director? PERE: (amagant-se) Calla, que ens sentirà! Ai, ai, ai, que ve cap aquí!</p>\n<p><strong>Text D</strong> Penso que els mòbils haurien de quedar a la bossa durant la classe, perquè ens distreuen i no ens deixen parlar entre nosaltres.</p>\n<p><strong>Text E</strong> Cantem el valent Roldà, / que va creuar la muntanya sol / i va vèncer el drac del regne.</p>\n</blockquote>\n<ol start=\"3\">\n<li>Al Text C, quin tipus de teatre és: tragèdia, comèdia o drama? Per què?</li>\n<li>Escriu amb les teves paraules la diferència entre una poesia lírica i una poesia èpica (una frase per a cadascuna).</li>\n<li>Una rondalla que ensenya una dona gran a la seva neta, sense que ningú sapigui qui la va inventar, és literatura oral o escrita? Dona dues raons.</li>\n</ol>", "test": {"marks": 10, "minutes": 10, "elements": [{"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>Vertader (V) o fals (F)?</p>\n<ul>\n<li>(a) Les rondalles populars solen ser anònimes. <span class=\"blank\" data-n=\"4\"></span></li>\n<li>(b) Una novel·la escrita per un autor concret té una versió única. <span class=\"blank\" data-n=\"4\"></span></li>\n<li>(c) La literatura oral es transmet només per escrit. <span class=\"blank\" data-n=\"4\"></span></li>\n</ul>", "maths": false, "tf": true, "tfx": false}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Llegeix cada fragment i escriu a quin gènere literari pertany (poesia lírica, poesia èpica, narrativa curta, teatre o assaig).</p>\n<blockquote>\n<p><strong>Text 1</strong> El vent esbarria les fulles i jo, amb el cor ple de silenci, et recordo a la finestra.</p>\n<p><strong>Text 2</strong> REINA: (cridant) On és la meva corona? CUINER: (tremolant) Majestat, me la vaig menjar… pensava que era un pastís!</p>\n<p><strong>Text 3</strong> Penso que cada escola hauria de tenir un hort, perquè així aprendríem a cuidar la natura i a menjar millor.</p>\n</blockquote>", "maths": false}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Escriu una cara
