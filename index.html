 then combine the two results.</li>\n</ul>\n<p><strong>5. Multiplication and division (multiplicación y división).</strong> First the sign, then the numbers.</p>\n<table>\n<thead>\n<tr>\n<th>Signs</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+ and +</td>\n<td>+</td>\n</tr>\n<tr>\n<td>− and −</td>\n<td>+</td>\n</tr>\n<tr>\n<td>+ and − (any order)</td>\n<td>−</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>(+6) × (−15) = −90. (−3) × (+4) × (−7) = 84 (two negatives → positive). (+35) ÷ (−5) = −7. (−18) ÷ (−3) = +6.</li>\n</ul>\n<p><strong>6. Powers.</strong> The sign depends on the exponent when the base is negative: even exponent → positive, odd exponent → negative. (−2)³ = −8 and (−2)⁴ = +16. Watch the brackets: (−3)² = 9 but −3² = −9 (here only the 3 is squared).</p>\n<p><strong>7. Combined operations (operaciones combinadas).</strong> Brackets first, from the inside out: ( ) then [ ]. In every part: powers and roots, then × and ÷ left to right, then + and − left to right. Write one line per step and finish the last step.</p>\n<h3>Ejemplo resuelto (Worked example)</h3>\n<p>5 × (−3 − 2²) + 3² ÷ (7 − 4) + 2 × (3 − 5)</p>\n<ol>\n<li>Inside the first bracket, power first: 2² = 4, so (−3 − 4) = −7. Other brackets: (7 − 4) = 3 and (3 − 5) = −2.</li>\n<li>Now: 5 × (−7) + 3² ÷ 3 + 2 × (−2). Power: 3² = 9.</li>\n<li>× and ÷: −35 + 3 + (−4).</li>\n<li>Add: −35 + 3 − 4 = <strong>−36</strong>.</li>\n</ol>\n<h3>Práctica (Practice – write all the steps and the units)</h3>\n<ol>\n<li>Completa: |−15| = ?   |+8| = ?   op(−9) = ?   op(+12) = ?</li>\n<li>Ordena de menor a mayor: −7, 3, −12, 0, 5, −1.</li>\n<li>Calcula: a) (−8) + (+5)  b) (−6) + (−9)  c) (+14) + (−20)  d) (−5) − (−12)  e) (+3) − (+11)</li>\n<li>Calcula: (−12) + (+7) + (−4) + (+20)</li>\n<li>Calcula: a) (−7) × (+6)  b) (−4) × (−9)  c) (+48) ÷ (−6)  d) (−72) ÷ (−8)  e) (−2) × (+5) × (−3)</li>\n<li>Calcula: a) (−3)²  b) (−2)³  c) −4²  d) (−1)⁵  e) (−10)²</li>\n<li>Operaciones combinadas: a) 8 − 3 × (−4) + 10 ÷ (−2)  b) (−5) × [6 − (−2)] + 3²  c) −[(7 − 2) − (9 + 4)] + 6</li>\n<li>Problema: Un buceador está a −45 m. Sube 18 m y después baja 12 m. ¿En qué posición está ahora? <em>(A diver at −45 m rises 18 m, then goes down 12 m. Where is the diver now?)</em></li>\n<li>Problema: En una ciudad la temperatura mínima fue −8 °C y la máxima fue 3 °C. ¿Cuántos grados de diferencia hubo? <em>(Minimum −8 °C, maximum 3 °C: what is the difference?)</em></li>\n<li>Problema: Una cuenta bancaria tiene un saldo de −150 €. Se ingresan 200 € y después se paga una factura de 85 €. ¿Cuál es el saldo final? <em>(Balance −150 €, a deposit of 200 €, then a bill of 85 €. Final balance?)</em></li>\n</ol>", "test": {"marks": 15, "minutes": 15, "elements": [{"t": "text", "html": "<p>Escribe todos los pasos. En el problema escribe una <strong>respuesta</strong> con una frase. Antes de entregar: ¿he contestado todo y terminado el último paso? <em>(Write all steps. In the problem write an answer sentence. Before handing in: did I answer everything and finish the last step?)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 3.0, "html": "<p>a) Completa: |−17| = <span class=\"blank\" data-n=\"3\"></span>   op(−25) = <span class=\"blank\" data-n=\"3\"></span>   op(+8) = <span class=\"blank\" data-n=\"3\"></span></p>\n<p>b) Ordena de menor a mayor: −9, 4, −2, 0, −15, 7</p>", "maths": true}, {"t": "q", "id": "q2", "n": "2", "marks": 3.0, "html": "<p>Calcula: a) (−13) + (+8)  b) (−6) − (−15)  c) (−5) + (+12) + (−9) − (−4)</p>", "maths": true}, {"t": "q", "id": "q3", "n": "3", "marks": 2.0, "html": "<p>Calcula: a) (−8) × (+7)  b) (−54) ÷ (−9)</p>", "maths": true}, {"t": "q", "id": "q4", "n": "4", "marks": 1.0, "html": "<p>Calcula: a) (−3)³  b) (−5)²</p>", "maths": true}, {"t": "q", "id": "q5", "n": "5", "marks": 3.0, "html": "<p>Calcula con todos los pasos: 4 × (−3 + 5) − 18 ÷ (−3) + (−2)²</p>", "maths": true}, {"t": "q", "id": "q6", "n": "6", "marks": 3.0, "html": "<p>En un edificio los sótanos tienen números negativos: −1, −2, −3 y −4. Ana está en la planta −3. Sube 7 plantas y después baja 5 plantas. ¿En qué planta está al final? <em>(Ana is on floor −3, goes up 7 floors, then down 5. Which floor is she on?)</em></p>", "maths": true}], "footer": "", "rule": "No calculator", "title": "Test del Módulo 3 – T3 Enteros"}}, {"id": "mat4", "n": 4, "title": "T4 Números fraccionarios", "sub": "fichas 35–48", "study": 70, "learn": "<p>The school said T4 is \"lo que nos dé tiempo\" (as far as time allows). If Ryan only managed part of T4 in class, do points 1–5 first, then 6–8 only if he has seen them.</p>\n<h3>Lo esencial (The essentials)</h3>\n<p><strong>1. What is a fraction (fracción)?</strong> a/b: the <em>denominador</em> b says into how many equal parts the whole is divided, the <em>numerador</em> a says how many parts we take. 3/8 = 3 parts out of 8.</p>\n<ul>\n<li>Fracción propia: numerator smaller than denominator (less than 1), e.g. 3/4.</li>\n<li>Fracción impropia: numerator bigger (more than 1), e.g. 7/3. As a mixed number (número mixto): 7/3 = 2 1/3, because 7 ÷ 3 = 2 remainder 1.</li>\n<li>Back to a fraction: 3 2/5 = (3 × 5 + 2)/5 = 17/5.</li>\n</ul>\n<p><strong>2. Fraction of a quantity (fracción de una cantidad).</strong> Divide by the denominator, then multiply by the numerator. 3/5 de 40: 40 ÷ 5 = 8, then 8 × 3 = 24.</p>\n<p><strong>3. Equivalent fractions (fracciones equivalentes) and simplifying.</strong> Multiply or divide numerator and denominator by the same number and the value does not change: 2/3 = 4/6 = 8/12. Two fractions a/b and c/d are equivalent if a × d = b × c.</p>\n<ul>\n<li>To simplify (simplificar), divide top and bottom by the same number until you cannot any more. The result is the <em>fracción irreducible</em>. Fastest: divide by the m.c.d. 18/24: m.c.d. = 6, so 18/24 = 3/4.</li>\n</ul>\n<p><strong>4. Comparing fractions (comparar).</strong> Same denominator: the bigger numerator wins. Different denominators: first make the denominators equal (denominador común, using the m.c.m.), then compare.</p>\n<ul>\n<li>3/4 and 5/6: m.c.m. of 4 and 6 is 12. 3/4 = 9/12 and 5/6 = 10/12, so 3/4 &lt; 5/6.</li>\n</ul>\n<p><strong>5. Adding and subtracting (suma y resta).</strong> Same denominator: add or subtract the numerators and keep the denominator. 2/7 + 3/7 = 5/7. Different denominators: use the m.c.m. as common denominator first.</p>\n<ul>\n<li>1/4 + 5/6 = 3/12 + 10/12 = 13/12 = 1 1/12.</li>\n<li>5/6 − 1/4 = 10/12 − 3/12 = 7/12.</li>\n</ul>\n<p><strong>6. Multiplying (multiplicación).</strong> Numerators together, denominators together. Simplify first if you can. 2/3 × 9/10 = 18/30 = 3/5.</p>\n<p><strong>7. Dividing (división).</strong> Multiply by the inverse (el inverso) of the second fraction: turn it upside down. 2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6. A whole number is a fraction over 1: 4/7 ÷ 2 = 4/7 ÷ 2/1 = 4/14 = 2/7.</p>\n<p><strong>8. Fraction problems.</strong> \"What is left?\" = 1 (the whole) minus the fractions used, and 1 = the denominator over itself (12/12). Then take that fraction of the quantity.</p>\n<h3>Ejemplo resuelto (Worked example)</h3>\n<p>María tiene 48 €. Gasta 1/6 en una camiseta y 1/3 en un libro. ¿Cuánto dinero le queda?</p>\n<ol>\n<li>Spent: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2.</li>\n<li>Left: 1 − 1/2 = 1/2.</li>\n<li>1/2 de 48 = 48 ÷ 2 = 24.</li>\n<li>Respuesta: Le quedan <strong>24 €</strong>. (Check: T-shirt 8 € + book 16 € = 24 € spent; 48 − 24 = 24 €.)</li>\n</ol>\n<h3>Práctica (Practice – write all the steps)</h3>\n<ol>\n<li>Calcula: a) 3/5 de 40  b) 2/9 de 63</li>\n<li>Completa: a) 2/3 = ?/12  b) 15/20 = 3/?</li>\n<li>Simplifica hasta la fracción irreducible: a) 18/24  b) 42/56  c) 30/45</li>\n<li>Compara con &lt; o &gt;: a) 3/4 y 5/6  b) 2/5 y 3/10</li>\n<li>Calcula: a) 2/7 + 3/7  b) 1/4 + 5/6  c) 5/6 − 1/4  d) 7/8 − 1/3</li>\n<li>Pasa a número mixto: 11/4. Pasa a fracción: 3 2/5.</li>\n<li>Calcula: a) 2/3 × 9/10  b) 3/4 × 8/15</li>\n<li>Calcula: a) 3/5 ÷ 9/10  b) 4/7 ÷ 2</li>\n<li>Problema: Mario tiene 80 €. Gasta 1/2 en un juego y 1/5 en un libro. ¿Qué fracción gasta en total? ¿Cuántos euros le quedan? <em>(Mario has 80 €, spends 1/2 on a game and 1/5 on a book. What fraction in total? How many euros are left?)</em></li>\n<li>Reto (challenge): 1/2 + 1/3 × 3/4. Remember: multiply before adding.</li>\n</ol>", "test": {"marks": 14, "minutes": 15, "elements": [{"t": "text", "html": "<p>Escribe todos los pasos. En el problema escribe una <strong>respuesta</strong> con una frase. Antes de entregar: ¿he contestado todo y terminado el último paso (simplificar, unidades)? <em>(Write all steps. In the problem write an answer sentence. Before handing in: did I answer everything and finish the last step, such as simplifying and units?)</em></p>"}, {"t": "q", "id": "q1", "n": "1", "marks": 2.0, "html": "<p>Calcula: a) 3/8 de 56  b) 2/5 de 45</p>", "maths": true}, {"t": "q", "id": "q2", "n": "2", "marks": 2.0, "html": "<p>Simplifica hasta la fracción irreducible: a) 24/36  b) 45/60</p>", "maths": true}, {"t": "q", "id": "q3", "n": "3", "marks": 1.0, "html": "<p>Completa con el número que falta: a) 3/4 = ?/20  b) 14/21 = 2/?</p>", "maths": true}, {"t": "q", "id": "q4", "n": "4", "marks": 1.0, "html": "<p>Compara con &lt;, &gt; o =: a) 2/3 <span class=\"blank\" data-n=\"3\"></span> 3/5  b) 5/8 <span class=\"blank\" data-n=\"3\"></span> 3/4</p>", "maths": true}, {"t": "q", "id": "q5", "n": "5", "marks": 4.0, "html": "<p>Calcula y simplifica el resultado: a) 2/9 + 5/6  b) 7/8 − 1/6  c) 4/5 × 15/8  d) 3/4 ÷ 9/8</p>", "maths": true}, {"t": "q", "id": "q6", "n": "6", "marks": 4.0, "html": "<p>Lucía tiene 60 €. Gasta 1/3 en un libro y 1/4 en una entrada de cine. a) ¿Qué fracción de su dinero gasta en total? b) ¿Cuántos euros le quedan? <em>(Lucía has 60 € and spends 1/3 on a book and 1/4 on a cinema ticket. a) What fraction in total? b) How many euros are left?)</em></p>", "maths": true}], "footer": "", "rule": "No calculator", "title": "Test del Módulo 4 – T4 Fracciones"}}], "extras": [{"title": "Vocabulary list", "html": "<p>Read this list once before the test. The first block is the words in the instructions, so Ryan always knows what he is asked to do.</p>\n<p><strong>Words in the instructions</strong></p>\n<table>\n<thead>\n<tr>\n<th>Español</th>\n<th>English</th>\n<th>Ejemplo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Calcula</td>\n<td>Calculate</td>\n<td>Calcula 15 × 38.</td>\n</tr>\n<tr>\n<td>Resuelve</td>\n<td>Solve</td>\n<td>Resuelve el problema.</td>\n</tr>\n<tr>\n<td>Escribe</td>\n<td>Write</td>\n<td>Escribe con cifras.</td>\n</tr>\n<tr>\n<td>Ordena (de menor a mayor)</td>\n<td>Put in order (smallest to biggest)</td>\n<td>Ordena de menor a mayor: −3, 5, 0.</td>\n</tr>\n<tr>\n<td>Redondea</td>\n<td>Round</td>\n<td>Redondea 6 749 a las centenas.</td>\n</tr>\n<tr>\n<td>Simplifica</td>\n<td>Simplify</td>\n<td>Simplifica 18/24.</td>\n</tr>\n<tr>\n<td>Completa</td>\n<td>Complete / fill in</td>\n<td>Completa: 2/3 = ?/12.</td>\n</tr>\n<tr>\n<td>Compara</td>\n<td>Compare</td>\n<td>Compara con &lt; o &gt;.</td>\n</tr>\n<tr>\n<td>Comprueba</td>\n<td>Check</td>\n<td>Comprueba con la división.</td>\n</tr>\n<tr>\n<td>Justifica / Explica</td>\n<td>Justify / explain</td>\n<td>Explica tu respuesta.</td>\n</tr>\n<tr>\n<td>Respuesta</td>\n<td>Answer</td>\n<td>Respuesta: Quedan 226 cuadernos.</td>\n</tr>\n<tr>\n<td>Sobra / queda(n)</td>\n<td>is left over / are left</td>\n<td>¿Cuántos quedan?</td>\n</tr>\n<tr>\n<td>En total</td>\n<td>In total</td>\n<td>¿Cuántos hay en total?</td>\n</tr>\n<tr>\n<td>Cada uno</td>\n<td>Each</td>\n<td>12 cajas con 48 cuadernos cada una.</td>\n</tr>\n<tr>\n<td>Gasta / ahorra / ingresa</td>\n<td>spends / saves / pays in</td>\n<td>Ingresa 200 €.</td>\n</tr>\n<tr>\n<td>Sube / baja</td>\n<td>goes up / goes down</td>\n<td>El buceador sube 18 m.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Maths words</strong></p>\n<table>\n<thead>\n<tr>\n<th>Español</th>\n<th>English</th>\n<th>Ejemplo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>número natural</td>\n<td>natural number (0, 1, 2, 3 …)</td>\n<td>15 es un número natural.</td>\n</tr>\n<tr>\n<td>número entero</td>\n<td>integer (… −2, −1, 0, 1, 2 …)</td>\n<td>−7 es un número entero.</td>\n</tr>\n<tr>\n<td>cifra</td>\n<td>digit</td>\n<td>4 725 tiene cuatro cifras.</td>\n</tr>\n<tr>\n<td>suma, sumando</td>\n<td>sum, addend</td>\n<td>En 3 + 4, los sumandos son 3 y 4.</td>\n</tr>\n<tr>\n<td>resta</td>\n<td>subtraction</td>\n<td>La resta de 9 y 4 es 5.</td>\n</tr>\n<tr>\n<td>producto, factor</td>\n<td>product, factor</td>\n<td>En 6 × 5 = 30, 30 es el producto.</td>\n</tr>\n<tr>\n<td>dividendo, divisor, cociente, resto</td>\n<td>dividend, divisor, quotient, remainder</td>\n<td>En 47 ÷ 5, el cociente es 9 y el resto es 2.</td>\n</tr>\n<tr>\n<td>potencia, base, exponente</td>\n<td>power, base, exponent</td>\n<td>En 2³, la base es 2 y el exponente es 3.</td>\n</tr>\n<tr>\n<td>raíz cuadrada</td>\n<td>square root</td>\n<td>La raíz cuadrada de 49 es 7.</td>\n</tr>\n<tr>\n<td>paréntesis, corchetes</td>\n<td>round brackets, square brackets</td>\n<td>Primero resuelvo el paréntesis.</td>\n</tr>\n<tr>\n<td>propiedad conmutativa / asociativa / distributiva</td>\n<td>commutative / associative / distributive property</td>\n<td>3 × (4 + 5) = 3 × 4 + 3 × 5 es la propiedad distributiva.</td>\n</tr>\n<tr>\n<td>múltiplo</td>\n<td>multiple</td>\n<td>12 es múltiplo de 3.</td>\n</tr>\n<tr>\n<td>divisor</td>\n<td>divisor (a number that divides exactly)</td>\n<td>4 es divisor de 12.</td>\n</tr>\n<tr>\n<td>divisible por</td>\n<td>divisible by</td>\n<td>30 es divisible por 5.</td>\n</tr>\n<tr>\n<td>número primo</td>\n<td>prime number</td>\n<td>13 es un número primo.</td>\n</tr>\n<tr>\n<td>número compuesto</td>\n<td>composite number</td>\n<td>15 es un número compuesto.</td>\n</tr>\n<tr>\n<td>factores primos</td>\n<td>prime factors</td>\n<td>12 = 2² × 3.</td>\n</tr>\n<tr>\n<td>máximo común divisor (m.c.d.)</td>\n<td>greatest common divisor</td>\n<td>El m.c.d. de 12 y 18 es 6.</td>\n</tr>\n<tr>\n<td>mínimo común múltiplo (m.c.m.)</td>\n<td>least common multiple</td>\n<td>El m.c.m. de 12 y 18 es 36.</td>\n</tr>\n<tr>\n<td>valor absoluto</td>\n<td>absolute value</td>\n<td>El valor absoluto de −3 es 3.</td>\n</tr>\n<tr>\n<td>valor opuesto</td>\n<td>opposite</td>\n<td>El opuesto de −5 es +5.</td>\n</tr>\n<tr>\n<td>recta numérica</td>\n<td>number line</td>\n<td>Los negativos están a la izquierda del 0.</td>\n</tr>\n<tr>\n<td>fracción, numerador, denominador</td>\n<td>fraction, numerator, denominator</td>\n<td>En 3/8, el numerador es 3 y el denominador es 8.</td>\n</tr>\n<tr>\n<td>fracción equivalente</td>\n<td>equivalent fraction</td>\n<td>1/2 y 2/4 son equivalentes.</td>\n</tr>\n<tr>\n<td>fracción irreducible</td>\n<td>fraction in simplest form</td>\n<td>3/4 es irreducible.</td>\n</tr>\n<tr>\n<td>denominador común</td>\n<td>common denominator</td>\n<td>Para sumar uso un denominador común.</td>\n</tr>\n<tr>\n<td>inverso</td>\n<td>inverse (the fraction upside down)</td>\n<td>El inverso de 2/3 es 3/2.</td>\n</tr>\n<tr>\n<td>número mixto</td>\n<td>mixed number</td>\n<td>2 1/3 es un número mixto.</td>\n</tr>\n</tbody>\n</table>"}]}], "scripts": {"m7_practice": [{"who": "", "text": "Attention, students! This is an announcement about the Spring Talent Show. The show will take place on Thursday, the fourteenth of May, in the school gym. The doors open at five thirty and the show starts at six. You can sign up until the end of this week, but you have to give your name to Mr Vidal in the music room. Each act can last four minutes at most. You are allowed to use your own instruments, but you mustn't bring loud speakers, because the school will provide the sound system. Tickets cost three euros, and all the money will go to the local animal shelter. Please don't wait until the last moment. Last year we had to say no to six students who were too late. Thank you!"}], "m7_test": [{"who": "Presenter", "text": "Welcome back to Youth Radio. Today I'm talking to Jade, a sixteen-year-old drummer whose band, the Night Owls, is playing at Riverside Park this Saturday. Jade, how long have you been playing?"}, {"who": "Jade", "text": "I started when I was eight. At first I couldn't keep the beat at all, but now I can play for two hours without a break."}, {"who": "Presenter", "text": "And tell us about Saturday."}, {"who": "Jade", "text": "Well, the gates open at four o'clock, and we go on stage at seven thirty. We're the support act. The headline act is a band from Valencia called Sol Rojo. Tickets cost twelve euros, but children under ten don't have to pay. You mustn't bring glass bottles, and you can't take big bags inside."}, {"who": "Presenter", "text": "Are you nervous?"}, {"who": "Jade", "text": "A little! Last year the microphone stopped working in the middle of our first song, but we managed to finish it anyway. I hope nothing like that happens this time."}, {"who": "Presenter", "text": "Good luck, Jade!"}]}};

<script>
(() => {
'use strict';
const KEY = 'ryan-study-shelf-v1';
const $app = document.getElementById('app');
const SUBJ = Object.fromEntries(DATA.subjects.map(s => [s.id, s]));
const MODS = {};
DATA.subjects.forEach(s => s.modules.forEach(m => { MODS[m.id] = m; m.subject = s.id; }));

/* ---------- state & storage ---------- */
let memOnly = false;
let S = { mods: {}, pin: '', fs: 19, backup: null };
function load() {
  try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); }
  catch (e) { memOnly = true; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { memOnly = true; }
}
/* each module carries a timestamp (ts) that changes whenever its content changes; used to merge devices */
const snap = {};
const modJson = m => { const c = Object.assign({}, m); delete c.ts; return JSON.stringify(c); };
function initSnap() { for (const id in S.mods) snap[id] = modJson(S.mods[id]); }
function save() {
  for (const id in S.mods) {
    const m = S.mods[id], j = modJson(m);
    if (snap[id] !== j) { snap[id] = j; if (m.stage !== 'new') m.ts = Date.now(); }
  }
  persist();
  if (sync.cfg) { sync.pending = true; clearTimeout(sync.timer); sync.timer = setTimeout(() => doSync(), 2500); }
}

/* ---------- GitHub secret-gist sync ---------- */
const SK = 'ryan-study-sync-v1';
const sync = { cfg: null, state: 'off', last: null, busy: false, pending: false, timer: null };
function loadSync() { try { sync.cfg = JSON.parse(localStorage.getItem(SK)); } catch (e) {} sync.state = sync.cfg ? 'idle' : 'off'; }
function saveSync() { try { if (sync.cfg) localStorage.setItem(SK, JSON.stringify(sync.cfg)); else localStorage.removeItem(SK); } catch (e) {} }
async function gh(path, opts, cfg) {
  const c = cfg || sync.cfg;
  const r = await fetch('https://api.github.com' + path, Object.assign({
    headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' } }, opts));
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
const payload = () => JSON.stringify({ v: 1, updated: Date.now(), pin: S.pin, mods: S.mods });
function merge(rem) {
  let changed = false;
  for (const id in (rem.mods || {})) {
    const r = rem.mods[id];
    if (!MODS[id] || !r || !STAGE[r.stage]) continue;
    const l = S.mods[id];
    if (!l || (r.ts || 0) > (l.ts || 0)) { S.mods[id] = r; snap[id] = modJson(r); changed = true; }
  }
  if (rem.pin && !S.pin) { S.pin = rem.pin; changed = true; }
  return changed;
}
function updInd() {
  const el = document.getElementById('syncind'); if (!el) return;
  const t = { off: 'Sync: not connected', idle: 'Sync: connected', ok: 'Synced ✓ ' + (sync.last ? new Date(sync.last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''),
    offline: 'Offline · will retry', error: 'Sync problem · check Parent settings', busy: 'Syncing…' }[sync.busy ? 'busy' : sync.state];
  el.textContent = t;
}
async function doSync() {
  if (!sync.cfg) return;
  if (sync.busy) { sync.pending = true; return; }
  sync.busy = true; updInd();
  const hadLocal = sync.pending; sync.pending = false;
  try {
    const g = await gh('/gists/' + sync.cfg.gistId);
    const f = g.files && g.files['progress.json'];
    let changed = false;
    if (f) {
      const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      changed = merge(JSON.parse(txt));
    }
    if (changed) persist();
    if (hadLocal || !f) {
      await gh('/gists/' + sync.cfg.gistId, { method: 'PATCH', body: JSON.stringify({ files: { 'progress.json': { content: payload() } } }) });
    }
    sync.state = 'ok'; sync.last = Date.now();
    if (changed && (route.name === 'home' || route.name === 'subject')) render();
  } catch (e) {
    sync.pending = sync.pending || hadLocal;
    sync.state = /^(401|403|404)$/.test(e.message) ? 'error' : 'offline';
    if (sync.state === 'offline') { clearTimeout(sync.timer); sync.timer = setTimeout(() => doSync(), 30000); }
  } finally { sync.busy = false; updInd(); if (sync.pending && sync.state !== 'error' && sync.state !== 'offline') { clearTimeout(sync.timer); sync.timer = setTimeout(() => doSync(), 1500); } }
}
function M(id) {
  if (!S.mods[id]) S.mods[id] = { stage: 'new', answers: {}, plays: 0 };
  return S.mods[id];
}
/* stage: new -> learning -> testing -> submitted -> marked -> complete */
const STAGE = {
  new:       { label: 'Not started',       pct: 0,   cls: '' },
  learning:  { label: 'Learning',          pct: 20,  cls: 'now' },
  testing:   { label: 'Test in progress',  pct: 40,  cls: 'now' },
  submitted: { label: 'Waiting for marking', pct: 60, cls: 'wait' },
  marked:    { label: 'Review mistakes',   pct: 85,  cls: 'wait' },
  complete:  { label: 'Complete',          pct: 100, cls: 'done' },
};
const pctOf = id => STAGE[(S.mods[id] || {}).stage || 'new'].pct;
const subjPct = s => Math.round(s.modules.reduce((a, m) => a + pctOf(m.id), 0) / s.modules.length);
const subjDone = s => s.modules.filter(m => (S.mods[m.id] || {}).stage === 'complete').length;

const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs = t => t.elements.filter(e => e.t === 'q');

/* ---------- router ---------- */
let route = { name: 'home' };
function go(name, p = {}) {
  stopAudio();
  route = Object.assign({ name }, p);
  render();
  window.scrollTo(0, 0);
}
function render() {
  document.documentElement.style.setProperty('--fs', S.fs + 'px');
  const r = route;
  let html;
  switch (r.name) {
    case 'home': html = vHome(); break;
    case 'subject': html = vSubject(r.s); break;
    case 'extra': html = vExtra(r.s, r.i); break;
    case 'learn': html = vLearn(r.m); break;
    case 'test': html = vTest(r.m); break;
    case 'waiting': html = vWaiting(r.m); break;
    case 'mark': html = vMark(r.m); break;
    case 'result': html = vResult(r.m); break;
    case 'settings': html = vSettings(); break;
    default: html = vHome();
  }
  $app.innerHTML = html;
  afterRender();
}
function header(crumb, back) {
  return `<header class="top">
    ${back ? `<button class="btn small" data-go='${esc(JSON.stringify(back))}'>← Back</button>` : ''}
    <div class="crumb">${esc(crumb)}</div>
    <button class="btn small ghost" data-fs="-1" title="Smaller text">A−</button>
    <button class="btn small ghost" data-fs="1" title="Larger text">A+</button>
    <button class="btn small" data-go='{"name":"home"}'>Home</button>
  </header>`;
}

/* ---------- views ---------- */
function vHome() {
  const cards = DATA.subjects.map(s => {
    const p = subjPct(s);
    return `<button class="card" data-go='{"name":"subject","s":"${s.id}"}'>
      <div class="top"><div class="name">${esc(s.name)}</div><div class="pct">${p}%</div></div>
      <div class="meta">${subjDone(s)} of ${s.modules.length} modules complete</div>
      <div class="bar"><i style="width:${p}%"></i></div></button>`;
  }).join('');
  const total = DATA.subjects.reduce((a, s) => a + s.modules.length, 0);
  const done = DATA.subjects.reduce((a, s) => a + subjDone(s), 0);
  return `<header class="top"><div class="crumb">Term 1 revision</div>
      <button class="btn small ghost" data-fs="-1">A−</button><button class="btn small ghost" data-fs="1">A+</button></header>
    <h1>Ryan’s Study Shelf</h1>
    <p class="sub">Pick a subject. ${done} of ${total} modules complete.</p>
    ${memOnly ? '<div class="note warn">This browser is not letting the page save progress. Use “Download backup” below before closing.</div>' : ''}
    ${cards}
    <div class="foot-note noprint">
      <div class="row">
        <button class="btn small ghost" data-act="export">Download backup</button>
        <button class="btn small ghost" data-act="import">Restore backup</button>
        <button class="btn small ghost" data-act="settings">Parent settings</button>
        <input type="file" id="imp" accept="application/json" hidden>
      </div>
      <p><span id="syncind"></span><br>Your answers and progress are saved in this browser${sync.cfg ? ' and synced online' : ''}.
      ${S.backup ? 'Last backup file: ' + esc(new Date(S.backup).toLocaleString()) + '.' : ''}</p>
    </div>`;
}

function statusTag(id) {
  const st = STAGE[(S.mods[id] || {}).stage || 'new'];
  return `<span class="tag ${st.cls}">${st.label}</span>`;
}
function vSubject(sid) {
  const s = SUBJ[sid];
  const list = s.modules.map(m => {
    const st = S.mods[m.id] || {};
    const p = pctOf(m.id);
    const sc = (st.stage === 'marked' || st.stage === 'complete') && st.score != null
      ? ` · Score ${st.score}/${m.test.marks}` : '';
    return `<button class="card" data-go='{"name":"module","m":"${m.id}"}'>
      <div class="top"><div class="name">${m.n}. ${esc(m.title)}</div><div class="pct">${p}%</div></div>
      <div class="meta">${m.sub ? esc(m.sub) + ' · ' : ''}Test: ${m.test.marks} marks${m.test.minutes ? ', ' + m.test.minutes + ' min' : ''}${sc}</div>
      <div style="margin-top:10px">${statusTag(m.id)}</div>
      <div class="bar"><i style="width:${p}%"></i></div></button>`;
  }).join('');
  const extras = (s.extras || []).map((x, i) =>
    `<button class="card" data-go='{"name":"extra","s":"${sid}","i":${i}}'><div class="name">${esc(x.title)}</div><div class="meta">Read only · no test</div></button>`).join('');
  return header(s.name, { name: 'home' }) +
    `<h1>${esc(s.name)}</h1><p class="sub">${subjDone(s)} of ${s.modules.length} modules complete · ${subjPct(s)}%</p>${list}${extras}`;
}
function vExtra(sid, i) {
  const x = SUBJ[sid].extras[i];
  return header(SUBJ[sid].name, { name: 'subject', s: sid }) + `<div class="read"><h1>${esc(x.title)}</h1>${x.html}</div>`;
}

/* module landing = learn page; route 'module' resolves to the right stage page */
function resolveModule(id) {
  const st = M(id);
  switch (st.stage) {
    case 'testing': return { name: 'test', m: id };
    case 'submitted': return { name: 'waiting', m: id };
    case 'marked': return { name: 'result', m: id };
    case 'complete': return { name: 'result', m: id };
    default: return { name: 'learn', m: id };
  }
}

function vLearn(id) {
  const m = MODS[id], st = M(id);
  if (st.stage === 'new') { st.stage = 'learning'; save(); }
  const audio = m.audio_practice ? audioPanel(m.audio_practice, 0, 'Practice recording (unlimited)') : '';
  const done = st.stage === 'complete' || st.stage === 'marked';
  return header(SUBJ[m.subject].name + ' · Module ' + m.n, { name: 'subject', s: m.subject }) +
    `<div class="read"><h1>${esc(m.title)}</h1>${m.sub ? `<p class="sub">${esc(m.sub)}</p>` : ''}
      <p class="small-caps">Learn · ${m.study ? 'about ' + m.study + ' minutes' : 'take your time'}</p>
      ${m.learn}${audio}</div>
    <div class="sticky-foot noprint">
      ${done ? '<button class="btn" data-go=\'{"name":"module","m":"' + id + '"}\'>See my result</button>' :
      `<button class="btn solid" data-act="starttest" data-m="${id}">I’m ready · Start the test</button>`}
      <button class="btn" data-go='{"name":"subject","s":"${m.subject}"}'>Modules</button>
    </div>`;
}

/* ---- audio (browser text-to-speech) ---- */
let audioToken = 0, audioBusy = false;
function stopAudio() { audioToken++; audioBusy = false; try { speechSynthesis.cancel(); } catch (e) {} }
function audioPanel(key, playsLeft, label) {
  const supported = 'speechSynthesis' in window;
  const limited = playsLeft !== 0;
  return `<div class="audio noprint" data-audio="${key}">
    <div class="small-caps">${esc(label)}</div>
    ${supported ? `<div class="row" style="margin-top:10px"><button class="btn solid" data-act="play" data-key="${key}" ${limited && playsLeft < 0 ? 'disabled' : ''}>▶ Play</button>
      <button class="btn" data-act="stop">■ Stop</button>
      ${limited ? `<span class="small-caps" id="plays">${playsLeft < 0 ? 'No plays left' : playsLeft + ' play' + (playsLeft === 1 ? '' : 's') + ' left'}</span>` : ''}</div>`
    : '<p>This browser can’t read aloud. Ask a parent to read the recording to you.</p>'}
  </div>`;
}
function speak(key, onend) {
  const segs = DATA.scripts[key];
  const my = ++audioToken;
  try { speechSynthesis.cancel(); } catch (e) {}
  const voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const pick = i => voices.length ? (voices.filter(v => /en[-_]GB/i.test(v.lang))[i % Math.max(1, voices.filter(v => /en[-_]GB/i.test(v.lang)).length)] || voices[i % voices.length]) : null;
  const who = {};
  let n = 0;
  const run = i => {
    if (my !== audioToken) return;
    if (i >= segs.length) { onend && onend(); return; }
    const u = new SpeechSynthesisUtterance(segs[i].text);
    u.lang = 'en-GB'; u.rate = 0.92;
    const w = segs[i].who || '_';
    if (!(w in who)) who[w] = n++;
    const v = pick(who[w]); if (v) u.voice = v;
    u.pitch = who[w] % 2 ? 1.25 : 1;
    u.onend = () => setTimeout(() => run(i + 1), 450);
    u.onerror = () => run(i + 1);
    speechSynthesis.speak(u);
  };
  run(0);
}

/* ---- test ---- */
const TOOLS = {
  cat: ['à','è','é','í','ò','ó','ú','ï','ü','ç','l·l','·','«','»','—'],
  bio: ['à','è','é','í','ò','ó','ú','ï','ü','ç','l·l','µ','×','→'],
  mat: ['¿','¡','á','é','í','ó','ú','ñ','²','³','×','÷','−','√','≈','≤','≥','π'],
  eng: ["’"],
};
function keyHas(a, id) { return Object.keys(a).some(k => (k === id || k.startsWith(id + '#') || k.startsWith(id + ':')) && String(a[k]).trim()); }
/* Build the interactive (or read-only) version of a question. Returns { html, used }.
   used=false means the question is plain text and gets the normal answer box. */
function qWidgets(e, a, ro) {
  /* answers typed into a plain box before the widgets existed stay readable */
  if (!['mc', 'tfn', 'circle'].includes(e.kind) && a[e.id] !== undefined && !Object.keys(a).some(k => k.startsWith(e.id + '#'))) return { used: false, html: e.html };
  const dis = ro ? ' disabled' : '';
  const val = k => a[e.id + '#' + k] || '';
  const rad = (k, v, label) => `<label class="opt"><input type="radio" name="${esc(e.id)}#${k}" data-a="${esc(e.id)}#${k}" value="${esc(v)}"${val(k) === v ? ' checked' : ''}${dis}> ${label}</label>`;
  const txt = (k, extra) => `<input type="text" class="cell ${extra || ''}" data-a="${esc(e.id)}#${k}" value="${esc(val(k))}"${dis} autocomplete="off">`;
  if (e.kind === 'mc' || e.kind === 'circle' || e.kind === 'tfn') {
    const opts = e.kind === 'tfn' ? ['True', 'False', 'Not Given'].map(x => ({ k: x, t: x })) : e.opts;
    const inline = e.kind !== 'mc' || opts.every(o => o.t.length < 22);
    return { used: true, html: `<div>${e.stem}</div><div class="${inline ? 'opts-inline' : ''}">${opts.map(o =>
      `<label class="opt"><input type="radio" name="${esc(e.id)}" data-a="${esc(e.id)}" value="${esc(o.k)}"${a[e.id] === o.k ? ' checked' : ''}${dis}> ${e.kind === 'mc' ? '(' + esc(o.k) + ') ' : ''}${o.t}</label>`).join('')}</div>` };
  }
  const box = document.createElement('div'); box.innerHTML = e.html;
  let used = false;
  const isTick = /✓|\btick\b/i.test(box.textContent.slice(0, 200));
  box.querySelectorAll('table').forEach(t => {
    const heads = [...t.querySelectorAll('thead th')].map(x => x.textContent.trim());
    t.querySelectorAll('tbody tr').forEach((tr, ri) => {
      const tds = [...tr.children];
      if (!tds[0].textContent.trim()) return;
      tds.forEach((td, ci) => {
        if (ci === 0 || td.textContent.trim()) return;
        const k = `r${ri}c${ci}`, h = heads[ci] || '';
        if (isTick) td.innerHTML = `<label class="tick"><input type="checkbox" data-a="${esc(e.id)}#${k}"${val(k) ? ' checked' : ''}${dis} aria-label="${esc(tds[0].textContent + ' – ' + h)}"></label>`;
        else if (/SÍ o NO/i.test(h)) td.innerHTML = rad(k, 'SÍ', 'SÍ') + rad(k, 'NO', 'NO');
        else if (h.includes(' / ')) td.innerHTML = `<select class="cell" data-a="${esc(e.id)}#${k}"${dis}><option value="">–</option>${h.split(' / ').map(x => x.trim().toLowerCase()).map(o => `<option${val(k) === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        else td.innerHTML = txt(k);
        used = true;
      });
    });
  });
  const nums = [...box.querySelectorAll('td')].map(td => (td.textContent.trim().match(/^(\d+)\./) || [])[1]).filter(Boolean);
  let mi = 0;
  box.querySelectorAll('p,li').forEach(p => {
    if (!p.textContent.includes('→')) return;
    p.querySelectorAll('.blank').forEach(b => {
      const k = 'm' + mi++;
      b.outerHTML = nums.length ? `<select class="cell" style="width:4.5em;min-width:0" data-a="${esc(e.id)}#${k}"${dis}><option value="">–</option>${nums.map(n => `<option${val(k) === n ? ' selected' : ''}>${n}</option>`).join('')}</select>` : txt(k, 'inl');
      used = true;
    });
  });
  if (e.tf) {
    box.querySelectorAll('.blank').forEach((b, i) => {
      b.outerHTML = `<span class="vf">${rad('t' + i, 'V', 'V')}${rad('t' + i, 'F', 'F')}</span>` +
        (e.tfx ? `<input type="text" class="cell vfx" data-a="${esc(e.id)}#t${i}x" placeholder="If false: write why / the correct sentence" value="${esc(val('t' + i + 'x'))}"${dis} autocomplete="off">` : '');
      used = true;
    });
  }
  box.querySelectorAll('.blank').forEach((b, i) => {
    const n = +b.dataset.n || 8;
    b.outerHTML = `<input type="text" class="cell inl" style="width:${Math.min(Math.max(n * 0.6, 6), 26)}em" data-a="${esc(e.id)}#b${i}" value="${esc(val('b' + i))}"${dis} autocomplete="off">`;
    used = true;
  });
  return { used, html: used ? box.innerHTML : e.html };
}
function vTest(id) {
  const m = MODS[id], st = M(id), t = m.test;
  const tools = TOOLS[m.subject].map(c => `<button type="button" data-ins="${esc(c)}" tabindex="-1">${esc(c)}</button>`).join('');
  const body = t.elements.map(e => {
    if (e.t === 'text') return `<div class="read ${e.cls || ''}">${e.html}</div>`;
    const mk = e.marks != null ? `<span class="mk">${e.marks} mark${e.marks === 1 ? '' : 's'}</span>` : '';
    const a = st.answers;
    const w = qWidgets(e, a, false);
    const field = w.used ? '' : e.maths
      ? `<div class="lbl">Working (write every step)</div><textarea class="work" data-a="${e.id}:w" rows="5">${esc(a[e.id + ':w'] || '')}</textarea>
         <div class="lbl">Final answer</div><textarea data-a="${e.id}:a" rows="2">${esc(a[e.id + ':a'] || '')}</textarea>`
      : `<textarea data-a="${e.id}" rows="${e.hint ? 3 : 2}" placeholder="${esc(e.hint || '')}">${esc(a[e.id] || '')}</textarea>`;
    return `<div class="q"><div class="qh"><div class="num">${e.n ? esc(e.n) + '.' : ''}</div><div class="qb read">${w.html}</div>${mk}</div>${field}</div>`;
  }).join('');
  const audio = t.audio ? audioPanel(t.audio, Math.max(0, (t.audio_plays || 2) - (st.plays || 0)) || -1, 'Listening · you can play it ' + (t.audio_plays || 2) + ' times') : '';
  return header(SUBJ[m.subject].name + ' · Test ' + m.n, null) +
    `<h1>${esc(m.title)}</h1>
     <p class="sub">${esc(t.title)} · ${t.marks} marks${t.minutes ? ' · about ' + t.minutes + ' minutes' : ''} · closed book${t.rule ? ' · ' + t.rule.toLowerCase() : ''}</p>
     <div class="note noprint">Your answers save by themselves as you type. The learning pages are locked until you hand in the test.</div>
     <div class="toolbar noprint"><span class="lbl">Insert</span>${tools}</div>
     ${audio}
     ${body}
     ${t.footer ? `<div class="read" style="margin-top:20px">${t.footer}</div>` : ''}
     <div class="sticky-foot noprint">
       <button class="btn solid" data-act="submit" data-m="${id}">Hand in the test</button>
       <button class="btn" data-go='{"name":"subject","s":"${m.subject}"}'>Save &amp; leave</button>
       <button class="btn ghost" data-act="discard" data-m="${id}">Parent: discard test</button>
     </div>`;
}

function answerText(m, e) {
  const a = M(m.id).answers;
  if (!keyHas(a, e.id) ) return { text: '', blank: true };
  const w = qWidgets(e, a, true);
  if (w.used) {
    const d = document.createElement('div'); d.innerHTML = w.html;
    d.querySelectorAll('input[type=checkbox]').forEach(i => i.replaceWith(i.checked ? '[x]' : '[ ]'));
    d.querySelectorAll('input[type=radio]').forEach(i => i.replaceWith(i.checked ? '(x)' : '( )'));
    d.querySelectorAll('select').forEach(i => i.replaceWith(i.value || '___'));
    d.querySelectorAll('input[type=text]').forEach(i => i.replaceWith(i.value || '___'));
    return { text: plain(d.innerHTML), blank: false, widget: true };
  }
  if (e.maths) {
    const w = (a[e.id + ':w'] || '').trim(), f = (a[e.id + ':a'] || '').trim();
    return { text: (w ? 'Working: ' + w : '') + (w && f ? '\n' : '') + (f ? 'Answer: ' + f : ''), blank: !w && !f };
  }
  const v = (a[e.id] || '').trim();
  return { text: v, blank: !v };
}
function plain(html) {
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('.blank').forEach(b => b.textContent = '____');
  d.querySelectorAll('p,li,tr,br').forEach(n => n.insertAdjacentText('afterend', '\n'));
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
function qView(m, e, extra = '') {
  const w = qWidgets(e, M(m.id).answers, true);
  const n = `<div class="num">${e.n ? esc(e.n) + '.' : ''}</div>`;
  if (w.used) return `<div class="q"><div class="qh">${n}<div class="qb read">${w.html}</div>${extra && extra.mk || ''}</div>${extra && extra.after || ''}</div>`;
  return `<div class="q"><div class="qh">${n}<div class="qb read">${e.html}</div>${extra && extra.mk || ''}</div>${ansBlock(m, e)}${extra && extra.after || ''}</div>`;
}
function ansBlock(m, e) {
  const { text, blank } = answerText(m, e);
  return `<div class="ans ${blank ? 'empty' : ''}">${blank ? '(no answer)' : esc(text)}</div>`;
}

/* parent marking */
function vMark(id) {
  const m = MODS[id], st = M(id), t = m.test;
  const flags = st.flags || {}, notes = st.notes || {};
  const items = qs(t).map(e => qView(m, e, { mk: e.marks != null ? `<span class="mk">${e.marks}</span>` : '', after: `
      <label class="check"><input type="checkbox" data-flag="${e.id}" ${flags[e.id] ? 'checked' : ''}><span>Not fully right: Ryan must review this one</span></label>
      <input class="note-in" type="text" data-note="${e.id}" placeholder="Short note for Ryan, e.g. “remember the m.c.d. rule” (optional)" value="${esc(notes[e.id] || '')}">` })).join('');
  return header('Parent · marking', { name: 'module', m: id }) +
    `<h1>Mark: ${esc(m.title)}</h1>
     <p class="sub">Mark with your answer key outside this app. Then enter the score and tick every question Ryan needs to review.</p>
     <div class="row"><label>Score&nbsp;<input type="number" id="score" min="0" max="${t.marks}" step="0.5" value="${st.score != null ? st.score : ''}"></label><span>out of <b>${t.marks}</b></span></div>
     ${items}
     <div class="sticky-foot">
       <button class="btn solid" data-act="savemark" data-m="${id}">Save result</button>
       <button class="btn" data-go='{"name":"module","m":"${id}"}'>Cancel</button>
       <button class="btn ghost" data-act="reset" data-m="${id}">Reset module (new attempt)</button>
     </div>`;
}

function vResult(id) {
  const m = MODS[id], st = M(id), t = m.test;
  const pct = Math.round(100 * st.score / t.marks);
  const band = pct >= 80 ? 'Strong. A quick re-read before the exam is enough.' :
               pct >= 60 ? 'Nearly there. Look carefully at the questions below.' :
                           'Good effort. Work through each question below, then go back to the module.';
  const wrong = qs(t).filter(e => (st.flags || {})[e.id]);
  const rev = st.reviewed || {};
  const complete = st.stage === 'complete';
  const wrongHtml = wrong.map(e => qView(m, e, { after: `
      ${(st.notes || {})[e.id] ? `<div class="lbl">Note from your parent</div><div class="ans">${esc(st.notes[e.id])}</div>` : ''}
      <label class="check"><input type="checkbox" data-rev="${e.id}" ${rev[e.id] || complete ? 'checked' : ''} ${complete ? 'disabled' : ''}><span>I have found the right answer and I understand why.</span></label>` })).join('');
  const allRev = wrong.every(e => rev[e.id]);
  return header(SUBJ[m.subject].name + ' · Result', { name: 'subject', s: m.subject }) +
    `<h1>${esc(m.title)}</h1>
     <div class="small-caps">Your score</div>
     <div class="score">${st.score}<span style="font-size:1.3rem;color:var(--soft)"> / ${t.marks}</span></div>
     <p class="sub">${pct}% · ${band}</p>
     ${wrong.length ? `<h2>Review: ${wrong.length} question${wrong.length === 1 ? '' : 's'} to understand</h2>
       <p>Look at each one. Go back to the module if you need to. Tick the box when you really understand it.</p>${wrongHtml}` :
       '<p>Nothing to review. Brilliant!</p>'}
     <div class="sticky-foot noprint">
       ${complete ? '<span class="tag done">Module complete ✓</span>' :
        `<button class="btn solid" data-act="declare" data-m="${id}" ${allRev ? '' : 'disabled'} id="declare">I have learned and understood all my mistakes</button>`}
       <button class="btn" data-act="reread" data-m="${id}">Read the module again</button>
       <button class="btn ghost" data-act="editmark" data-m="${id}">Parent: edit marking</button>
       <button class="btn" data-go='{"name":"subject","s":"${m.subject}"}'>Modules</button>
     </div>`;
}

/* ---------- interactions ---------- */
function afterRender() {
  document.querySelectorAll('textarea').forEach(autosize);
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight + 2, 0) + 'px'; }

let lastTA = null;
document.addEventListener('focusin', e => { const t = e.target; if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type === 'text' && t.dataset.a !== undefined)) lastTA = t; });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.a !== undefined) {
    let v = t.value;
    if (t.type === 'checkbox') v = t.checked ? '1' : '';
    else if (t.type === 'radio' && !t.checked) return;
    M(route.m).answers[t.dataset.a] = v; save();
    if (t.tagName === 'TEXTAREA') autosize(t);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rev !== undefined) {
    const st = M(route.m); (st.reviewed = st.reviewed || {})[t.dataset.rev] = t.checked; save();
    const wrong = qs(MODS[route.m].test).filter(x => (st.flags || {})[x.id]);
    const b = document.getElementById('declare'); if (b) b.disabled = !wrong.every(x => st.reviewed[x.id]);
  }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.toolbar button')) e.preventDefault(); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],[data-fs],[data-ins]');
  if (!el) return;
  if (el.dataset.ins !== undefined) {
    const ta = lastTA && document.body.contains(lastTA) ? lastTA : document.querySelector('textarea,input.cell');
    if (!ta) return;
    const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + el.dataset.ins + ta.value.slice(en);
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + el.dataset.ins.length;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  if (el.dataset.fs) { S.fs = Math.min(28, Math.max(15, S.fs + 2 * +el.dataset.fs)); save(); render(); return; }
  if (el.dataset.go) {
    const r = JSON.parse(el.dataset.go);
    if (r.name === 'module') { const x = resolveModule(r.m); go(x.name, x); } else go(r.name, r);
    return;
  }
  act(el.dataset.act, el.dataset);
});

function act(a, d) {
  const id = d.m;
  switch (a) {
    case 'starttest': {
      confirmBox('Start the test?', 'The learning pages will be hidden until you hand in the test. Your answers are saved as you type.', 'Start test', () => {
        const st = M(id); st.stage = 'testing'; save(); go('test', { m: id });
      });
      break;
    }
    case 'discard':
      if (!S.pin) { alert('A parent needs to set the parent PIN first (Home page, bottom).'); break; }
      confirmBox('Discard this test?', 'Your answers will be erased and a parent must enter the PIN. Then you can revise the module again.', 'Continue', () => {
        askPin(() => { const st = M(id); st.stage = 'learning'; st.answers = {}; st.plays = 0; save(); go('learn', { m: id }); });
      });
      break;
    case 'submit': {
      const t = MODS[id].test;
      const blanks = qs(t).filter(e => answerText(MODS[id], e).blank).length;
      confirmBox('Hand in the test?',
        (blanks ? `You have ${blanks} question${blanks === 1 ? '' : 's'} with no answer. A blank scores 0, a guess can score. ` : 'You answered every question. ') +
        'Did you read your answers once more? After handing in you cannot change them.', 'Hand in', () => {
        const st = M(id); st.stage = 'submitted'; st.submittedAt = Date.now(); save(); stopAudio(); go('waiting', { m: id });
      }, 'Keep working');
      break;
    }
    case 'parent': case 'editmark':
      if (!S.pin) { alert('A parent needs to set the parent PIN first (Home page, bottom).'); break; }
      askPin(() => go('mark', { m: id })); break;
    case 'settings':
      if (S.pin) askPin(() => go('settings')); else go('settings');
      break;
    case 'syncnow': doSync(); break;
    case 'syncoff': confirmBox('Disconnect sync?', 'This device stops syncing. Your saved progress stays on this device and in the gist.', 'Disconnect', () => { sync.cfg = null; saveSync(); sync.state = 'off'; render(); }); break;
    case 'connect': connect(); break;
    case 'setpin':
      if (!S.pin) askPin(null); else askPin(() => { S.pin = ''; save(); askPin(null); });
      break;
    case 'savemark': {
      const st = M(id), t = MODS[id].test;
      const v = parseFloat(document.getElementById('score').value);
      if (isNaN(v) || v < 0 || v > t.marks) { alert('Enter a score between 0 and ' + t.marks + '.'); return; }
      st.score = v;
      if (st.stage !== 'complete') { st.stage = 'marked'; st.reviewed = {}; }
      save(); go('result', { m: id });
      break;
    }
    case 'reset':
      confirmBox('Reset this module?', 'This erases the answers, score and review so Ryan can try again from the start.', 'Reset', () => {
        S.mods[id] = { stage: 'learning', answers: {}, plays: 0 }; save(); go('learn', { m: id });
      });
      break;
    case 'declare': {
      confirmBox('Mark module complete?', 'You are saying you have learned and understood every mistake.', 'Yes, complete', () => {
        const st = M(id); st.stage = 'complete'; st.completedAt = Date.now(); save(); go('result', { m: id });
      }, 'Not yet');
      break;
    }
    case 'reread': go('learn', { m: id, peek: true }); break;
    case 'play': {
      const key = d.key, m = route.m ? MODS[route.m] : null;
      const limited = route.name === 'test';
      if (limited) {
        const st = M(route.m);
        if ((st.plays || 0) >= (m.test.audio_plays || 2) || audioBusy) return;
        audioBusy = true;
        st.plays = (st.plays || 0) + 1; save();
        const left = (m.test.audio_plays || 2) - st.plays;
        const lab = document.getElementById('plays'); if (lab) lab.textContent = left > 0 ? left + ' play' + (left === 1 ? '' : 's') + ' left' : 'No plays left';
      }
      speak(key, () => {
        audioBusy = false;
        if (limited) { const b = document.querySelector('[data-act=play]'); const st = M(route.m); if (b && st.plays >= (m.test.audio_plays || 2)) b.disabled = true; }
      });
      break;
    }
    case 'stop': stopAudio(); if (route.name === 'test') { const b = document.querySelector('[data-act=play]'); if (b && (M(route.m).plays || 0) >= (MODS[route.m].test.audio_plays || 2)) b.disabled = true; } break;
    case 'print': window.print(); break;
    case 'dl': download(id); break;
    case 'export': {
      S.backup = Date.now(); save();
      blob(JSON.stringify(Object.assign({}, S, { pin: '' }), null, 1), 'ryan-study-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json'); render(); break;
    }
    case 'import': { const f = document.getElementById('imp'); f.onchange = () => {
      const file = f.files[0]; if (!file) return;
      const r = new FileReader(); r.onload = () => { try {
        const o = JSON.parse(r.result); if (!o.mods) throw 0; const keep = S.pin; for (const k in o.mods) if (!STAGE[o.mods[k].stage]) o.mods[k].stage = 'new';
        S = Object.assign({ mods: {}, pin: '', fs: 19, backup: null }, o, { pin: keep }); save(); render();
      } catch (e) { alert('That file is not a valid backup.'); } }; r.readAsText(file); }; f.click(); break; }
  }
}
// flag/note inputs on marking page
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.flag !== undefined) { const st = M(route.m); (st.flags = st.flags || {})[t.dataset.flag] = t.checked; save(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note !== undefined) { const st = M(route.m); (st.notes = st.notes || {})[t.dataset.note] = t.value; save(); }
});

/* learn page when peeking at a finished module should not reset stage: handled in vLearn (only 'new' changes) */

async function connect() {
  const tok = document.getElementById('tok').value.trim(), gid = document.getElementById('gid').value.trim();
  const msg = document.getElementById('syncmsg');
  if (!tok) { msg.textContent = 'Paste the token first.'; return; }
  msg.style.color = ''; msg.textContent = 'Connecting…';
  try {
    const cfg = { token: tok, gistId: gid };
    if (!gid) {
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'study-shelf progress', public: false, files: { 'progress.json': { content: payload() } } }) }, cfg);
      cfg.gistId = g.id;
    } else { await gh('/gists/' + gid, {}, cfg); }
    sync.cfg = cfg; saveSync(); sync.state = 'idle'; sync.pending = true;
    await doSync(); render();
  } catch (e) { msg.style.color = '#a33'; msg.textContent = 'Could not connect (' + e.message + '). Check the token has the “gist” permission and the Gist ID is right.'; }
}
function blob(text, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function download(id) {
  const m = MODS[id], st = M(id);
  let out = `# ${SUBJ[m.subject].name} – ${m.title}\nTest: ${m.test.title} (${m.test.marks} marks)\nHanded in: ${new Date(st.submittedAt).toLocaleString()}\n\n`;
  qs(m.test).forEach(e => {
    out += `## Question ${e.n || '(gaps)'}${e.marks != null ? ' (' + e.marks + ' marks)' : ''}\n${plain(e.html)}\n\n**Ryan’s answer:**\n${answerText(m, e).blank ? '(no answer)' : answerText(m, e).text}\n\n`;
  });
  blob(out, `${m.id}-answers.md`, 'text/markdown');
}

/* ---------- modals ---------- */
function modal(inner) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(bg);
  return bg;
}
function confirmBox(title, text, ok, fn, cancel = 'Cancel') {
  const bg = modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn solid" id="mok">${esc(ok)}</button><button class="btn" id="mno">${esc(cancel)}</button></div>`);
  bg.querySelector('#mno').onclick = () => bg.remove();
  bg.querySelector('#mok').onclick = () => { bg.remove(); fn(); };
}
function hp(v) { let h = 5381; for (const c of 'ryan:' + v) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return String(h); }
function askPin(fn) {
  const first = !S.pin;
  if (first && !fn) {}
  const bg = modal(`<h3>${first ? 'Parent: choose a PIN' : 'Parent PIN'}</h3>
    <p>${first ? 'Choose a PIN (4 or more characters) that only you know. You will use it to mark tests.' : 'Enter the parent PIN.'}</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off"> <div class="row" style="margin-top:14px"><button class="btn solid" id="mok">OK</button><button class="btn" id="mno">Cancel</button></div>
    <p id="perr" class="small-caps" style="color:#a33"></p>`);
  const inp = bg.querySelector('#pin'); inp.focus();
  const ok = () => {
    const v = inp.value.trim();
    if (first) { if (v.length < 4) { bg.querySelector('#perr').textContent = 'At least 4 characters.'; return; } S.pin = hp(v); save(); bg.remove(); fn && fn(); render(); }
    else if (hp(v) === S.pin) { bg.remove(); fn(); }
    else bg.querySelector('#perr').textContent = 'Wrong PIN.';
  };
  bg.querySelector('#mok').onclick = ok; bg.querySelector('#mno').onclick = () => bg.remove();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
}

window.addEventListener('beforeunload', stopAudio);
load();
loadSync();
initSnap();
render();
doSync();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') doSync(); });
})();
</script>
